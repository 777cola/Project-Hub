<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨境业务全景指南（北向 × 南向）</title>
<style>
:root{
  --navy:#1A4B8C; --navy2:#1a3a6e; --orange:#E86C00;
  --bg:#f5f8fc; --card:#ffffff; --line:#e8edf5;
  --text:#1f2937; --sub:#48576e; --green:#0e8a5f; --green-bg:#e8f7f0;
  --yellow:#b7791f; --yellow-bg:#fdf3e0; --red:#c0392b; --red-bg:#fdecea;
  --blue:#1a5bbf; --blue-bg:#eaf1fc;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Instrument Sans','Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.85;font-size:16px}
/* ===== 顶部导航 ===== */
.topnav{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);box-shadow:0 2px 12px rgba(26,59,110,.25);padding:0 28px;display:flex;align-items:center;gap:2px;overflow-x:auto;white-space:nowrap}
.topnav a{color:#dbe7f7;text-decoration:none;font-size:13.5px;padding:14px 10px;border-bottom:2px solid transparent;transition:.2s;flex:none}
.topnav a:hover{color:#fff;border-bottom-color:#ffd9a8}
.topnav a.cur{color:#fff;border-bottom-color:var(--orange);font-weight:600}
/* ===== Hero ===== */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 70%,#16305e 100%);color:#fff;padding:50px 28px 40px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(232,108,0,.28),transparent 65%)}
.hero::before{content:"";position:absolute;left:-100px;bottom:-160px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07),transparent 65%)}
.hero .wrap{max-width:1100px;margin:0 auto;position:relative;z-index:2}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;letter-spacing:.14em;color:#ffd9a8;border:1px solid rgba(255,217,168,.5);padding:4px 14px;border-radius:99px;margin-bottom:16px}
.hero h1{font-size:32px;font-weight:700;letter-spacing:.02em;margin-bottom:10px}
.hero .sub{font-size:15.5px;color:#d9e5f6;max-width:820px}
.hero .meta{margin-top:20px;display:flex;gap:12px;flex-wrap:wrap}
.hero .meta span{font-size:12.5px;color:#bcd0ea;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:99px}
.hstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin:24px 0 0}
.hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:14px 16px}
.hstat .n{font-size:22px;font-weight:700;color:#fff;letter-spacing:.01em}
.hstat .l{font-size:12.5px;color:#c9d9f0;margin-top:2px}
.hstat .s{font-size:11.5px;color:#9fb8d8;margin-top:2px}
/* ===== 布局 ===== */
.wrap{max-width:1100px;margin:0 auto;padding:0 28px}
section{padding:44px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;margin-bottom:20px;box-shadow:0 1px 3px rgba(26,59,110,.04);transition:box-shadow .25s}
.card:hover{box-shadow:0 6px 20px rgba(26,59,110,.09)}
.card h3{font-size:18.5px;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:9px}
.card h4{font-size:15.5px;color:var(--navy2);margin:18px 0 8px;display:flex;align-items:center;gap:7px}
.card h4 .n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;background:var(--navy);color:#fff;font-size:12px;padding:0 5px}
.section-title{font-size:23px;color:var(--navy2);margin-bottom:6px;display:flex;align-items:center;gap:9px}
.section-title svg{width:1em;height:1em;flex:none}
.sec-no{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;font-size:14px;font-weight:700;box-shadow:0 2px 6px rgba(26,59,110,.25)}
.section-desc{color:var(--sub);font-size:14.5px;margin-bottom:22px}
p{margin-bottom:11px}
ul,ol{margin:6px 0 12px 22px}
li{margin-bottom:6px}
b,strong{color:var(--navy2)}
/* ===== 表格 ===== */
.tbl{width:100%;border-collapse:collapse;margin:12px 0 18px;font-size:14.5px;line-height:1.7}
.tbl th{background:var(--navy);color:#fff;font-weight:600;padding:11px 14px;text-align:left;border:1px solid #32619e;white-space:nowrap}
.tbl td{border:1px solid var(--line);padding:10px 14px;vertical-align:top}
.tbl tr:nth-child(even) td{background:#f8fafd}
.tbl tr:hover td{background:#eef4fb}
.tbl td:first-child{font-weight:600;color:#2a3b52}
.tbl td:first-child .hl{color:var(--orange)}
.tbl td:first-child b{color:#2a3b52}
.tbl .hl{color:var(--orange);font-weight:600}
/* ===== 标签 ===== */
.tag{display:inline-block;font-size:12.5px;padding:2px 10px;border-radius:99px;margin-right:5px;vertical-align:1px}
.tag.g{background:var(--green-bg);color:var(--green);border:1px solid #bfe8d6}
.tag.y{background:var(--yellow-bg);color:var(--yellow);border:1px solid #f2ddb2}
.tag.r{background:var(--red-bg);color:var(--red);border:1px solid #f5cbc6}
.tag.b{background:var(--blue-bg);color:var(--blue);border:1px solid #c9dbf5}
.tag.o{background:#fdeee0;color:var(--orange);border:1px solid #f8d3ac}
/* ===== 步骤条 ===== */
.steps{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 6px}
.step{flex:1 1 150px;background:#f7fafd;border:1px solid var(--line);border-radius:8px;padding:13px 14px;min-width:160px}
.step .st{font-size:12.5px;color:var(--orange);font-weight:700;margin-bottom:3px;letter-spacing:.03em}
.step .sd{font-size:13.5px;color:var(--text)}
.step .stx{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.6}
/* ===== 时间线 ===== */
.tl{position:relative;margin:16px 0 10px;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--navy),#b9cdea)}
.tl .item{position:relative;margin-bottom:13px}
.tl .item::before{content:"";position:absolute;left:-23.5px;top:8px;width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--navy)}
.tl .date{font-size:12.5px;color:var(--orange);font-weight:700;letter-spacing:.02em}
.tl .txt{font-size:14.2px}
.h-tl{position:relative;margin:26px 0 12px;padding-top:26px}
.h-tl::before{content:"";position:absolute;left:0;right:0;top:9px;height:3px;background:linear-gradient(90deg,var(--navy),#7fa3d4)}
.h-tl .wrap-tl{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}
.h-tl .it{flex:1 0 130px;min-width:130px;position:relative;padding:0 10px;text-align:center}
.h-tl .it::before{content:"";position:absolute;top:-23px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--orange)}
.h-tl .d{font-size:12.5px;font-weight:700;color:var(--orange);white-space:nowrap}
.h-tl .t{font-size:12.5px;color:#2a3b52;margin-top:3px;line-height:1.6}
/* ===== 结构图 ===== */
.grid-flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.gf-box{background:#f7fafd;border:1.5px solid var(--navy);border-radius:8px;padding:12px;text-align:center;font-size:13.5px;font-weight:600;color:var(--navy2)}
.gf-box .gf-sub{display:block;font-weight:400;font-size:12.5px;color:var(--sub);margin-top:3px}
.gf-arrow{display:flex;align-items:center;justify-content:center;color:var(--orange);font-size:20px;font-weight:700}
.gf-note{font-size:12.5px;color:var(--sub);text-align:center;margin-top:6px}
/* ===== 对比卡 ===== */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
@media(max-width:760px){.duo{grid-template-columns:1fr}}
.pcard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#fbfcfe}
.pcard.good{border-top:3px solid var(--green)}
.pcard.bad{border-top:3px solid var(--red)}
.pcard h5{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.pcard ul{margin:0 0 0 18px;font-size:14px}
.pcard li{margin-bottom:6px}
/* ===== 提示框 ===== */
.note{border-left:4px solid var(--navy);background:var(--blue-bg);border-radius:0 8px 8px 0;padding:12px 16px;margin:14px 0;font-size:14.5px;line-height:1.75}
.note.warn{border-left-color:var(--orange);background:var(--yellow-bg)}
.note.danger{border-left-color:var(--red);background:var(--red-bg)}
.note.ok{border-left-color:var(--green);background:var(--green-bg)}
.note .nt{font-weight:700;color:var(--navy2);margin-right:6px}
.note.warn .nt{color:var(--orange)}
.note.danger .nt{color:var(--red)}
.note.ok .nt{color:var(--green)}
/* ===== 深色卡 ===== */
.taxcase{background:#0f2440;color:#e8eef7;border-radius:var(--radius);padding:20px 24px;margin:14px 0;font-size:14.2px;line-height:1.7}
.taxcase .tc-t{color:#ffd9a8;font-weight:700;margin-bottom:10px;font-size:14.5px}
.taxcase table{width:100%;border-collapse:collapse;margin-top:8px}
.taxcase td{border:1px solid rgba(255,255,255,.14);padding:9px 12px;vertical-align:top}
.taxcase td:first-child{white-space:nowrap;color:#9fb8d8;width:140px}
.taxcase .res{color:#7ee2b8;font-weight:700}
.taxcase .src{color:#a8bcd8;font-size:12.5px;margin-top:10px}
/* ===== FAQ ===== */
details{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;background:#fbfcfe;overflow:hidden}
summary{cursor:pointer;padding:13px 18px;font-weight:600;color:var(--navy2);font-size:14.5px;list-style:none;display:flex;align-items:center;gap:9px}
summary::before{content:"▸";color:var(--orange);transition:.2s;flex:none}
details[open] summary::before{transform:rotate(90deg)}
details .faq-body{padding:4px 18px 14px;font-size:14.5px;line-height:1.75}
/* ===== 数字徽章 ===== */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}
.stat{background:#f7fafd;border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center}
.stat .num{font-size:22px;font-weight:700;color:var(--navy)}
.stat .lbl{font-size:12.5px;color:var(--sub);margin-top:2px;line-height:1.6}
/* ===== 评分条形 ===== */
.score{display:grid;grid-template-columns:170px 1fr 110px;align-items:center;gap:12px;margin:8px 0;font-size:14px}
.score .sl{color:var(--navy2);font-weight:600;text-align:right}
.score .bar{height:14px;background:#edf1f7;border-radius:99px;overflow:hidden}
.score .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5b8fd0,var(--navy))}
.score .sv{font-size:13px;color:var(--sub)}
.score .sl2{color:var(--orange);font-weight:600;text-align:right}
.score .bar2{height:14px;background:#edf1f7;border-radius:99px;overflow:hidden}
.score .bar2 i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f5a25d,var(--orange))}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin:10px 0 0}
.legend .lg{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
/* ===== 决策树 ===== */
.tree{margin:16px 0}
.tree .tq{background:var(--navy);color:#fff;border-radius:8px;padding:12px 18px;text-align:center;font-weight:600;font-size:14px;display:inline-block;min-width:220px}
.tree .branch{display:flex;justify-content:center;gap:8px;font-size:12.5px;color:var(--sub);margin:4px 0}
.tree .tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:8px}
.tree .tcol{border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;background:#fbfcfe}
.tree .tcol .th{font-weight:700;color:var(--navy2);font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.tree .tcol .td{font-size:13.5px;line-height:1.7}
.tree .tcol .td b{color:var(--orange)}
.tree .tlink{display:flex;align-items:center;gap:6px;color:var(--orange);font-size:12px;margin:6px 0 2px;font-weight:600}
.tree .tlink::before{content:"↓";font-size:14px}
/* ===== 组织架构 ===== */
.org{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:14px 0}
.org .og{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fbfcfe}
.org .og .og-h{padding:10px 14px;font-weight:700;color:#fff;font-size:14px;display:flex;align-items:center;gap:8px}
.org .og .og-b{padding:12px 14px;font-size:13px;line-height:1.75}
.org .og .og-b .person{margin-bottom:7px}
.org .og .og-b .pn{font-weight:700;color:var(--navy2)}
.org .og .og-b .pd{color:var(--sub);font-size:12.5px}
/* ===== 地铁图 ===== */
.metro{background:#fbfcfe;border:1px solid var(--line);border-radius:8px;padding:18px;overflow-x:auto}
.metro svg{display:block;min-width:760px;width:100%;height:auto}
.metro text{font-family:'Instrument Sans','Noto Sans SC',sans-serif}
/* ===== 返回顶部 ===== */
#topBtn{position:fixed;right:26px;bottom:30px;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;border:none;cursor:pointer;font-size:18px;box-shadow:0 4px 14px rgba(26,59,110,.35);opacity:0;pointer-events:none;transition:.3s;z-index:99}
#topBtn.show{opacity:1;pointer-events:auto}
#topBtn:hover{background:var(--navy2)}
/* ===== 页脚 ===== */
footer{margin-top:50px;padding:28px;text-align:center;color:#5f718c;font-size:13px;line-height:1.9;border-top:1px solid var(--line)}
footer p{margin-bottom:4px}
/* ===== 通用 ===== */
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:14.5px;margin:8px 0 12px}
.kv dt{font-weight:700;color:var(--navy2);white-space:nowrap}
.kv dd{margin:0;line-height:1.7}
.src{font-size:12.5px;color:#5f718c;margin-top:10px;line-height:1.7}
.anchor{scroll-margin-top:64px}
@media print{
  .topnav,#topBtn{display:none!important}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
  section{break-inside:auto}
}
@media(max-width:640px){
  body{font-size:15px}
  .hero h1{font-size:24px}
  .wrap{padding:0 16px}
  .card{padding:18px 16px}
  .tbl{font-size:13px}
  .tbl th,.tbl td{padding:8px 10px}
  .score{grid-template-columns:110px 1fr 80px;gap:8px}
}

/* ===== 深色卡加粗文字提亮（v4.3） ===== */
.taxcase b,.taxcase strong{color:#ffd9a8}


/* 撰写者淡色 */
footer .author{color:#c3cddb}

</style>

<link rel="stylesheet" href="libs/markmap-toolbar.css">
<style>
  /* ===== 外壳：语言切换 / 思维导图浮层 ===== */
  #content{display:block}
  /* 三语切换：外框定宽，当前项内部平滑展开全称（对齐 qijunhao.xyz 的形态） */
  .lang-toggle{
    display:inline-flex;align-items:center;justify-content:center;
    width:176px;height:34px;padding:3px;gap:2px;
    background:#ffffff;border:1px solid #dfe8f4;border-radius:13px;
    box-shadow:0 4px 18px rgba(10,30,60,.16),0 1px 2px rgba(10,30,60,.06);
  }
  .lang-item{
    display:inline-flex;align-items:center;height:28px;padding:0 9px;
    font-size:12.5px;font-weight:600;letter-spacing:.03em;
    border-radius:9px;cursor:pointer;color:#6b7c93;white-space:nowrap;
    transition:color .3s,background .3s;-webkit-tap-highlight-color:transparent;
  }
  .lang-item .full{
    display:grid;grid-template-columns:0fr;padding-left:0;
    transition:grid-template-columns .45s cubic-bezier(.22,1,.36,1),
               padding-left .45s cubic-bezier(.22,1,.36,1);
  }
  .lang-item .full>span{
    overflow:hidden;white-space:nowrap;opacity:0;font-weight:500;
    transition:opacity .25s .1s;
  }
  .lang-item.active{
    color:#fff;background:linear-gradient(135deg,#1A4B8C 0%,#123A6E 100%);
    padding:0 10px;box-shadow:0 2px 7px rgba(18,58,110,.28);
  }
  .lang-item.active .full{grid-template-columns:1fr;padding-left:5px}
  .lang-item.active .full>span{opacity:1}
  .lang-item:hover:not(.active){color:#1A4B8C;background:#eef3fa}
  .lang-item:focus-visible{outline:2px solid #E86C00;outline-offset:2px}
  /* 脱敏提示：贴在导航栏右侧（语言切换左边） */
  #anonBanner{
    position:fixed;top:0;right:208px;height:55px;z-index:150;
    display:flex;align-items:center;gap:8px;
    color:rgba(255,255,255,.6);font-size:11.5px;line-height:1;
    white-space:nowrap;letter-spacing:.01em;
  }
  #anonBanner .ab-dot{
    width:6px;height:6px;border-radius:50%;background:#FFA45C;flex:none;
    box-shadow:0 0 0 3px rgba(255,164,92,.15);
  }
  #anonBanner b{color:#FFC08A;font-weight:600;font-size:11.5px;letter-spacing:.02em}
  #anonBanner .ab-text{color:rgba(255,255,255,.48);border-left:1px solid rgba(255,255,255,.16);padding-left:9px}
  @media (max-width:1240px){ #anonBanner .ab-text{display:none} }
  @media (max-width:860px){ #anonBanner{display:none} }
  #langs{position:fixed;top:12px;right:16px;z-index:220}

  #mapBtn{
    position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:210;
    display:flex;align-items:center;gap:9px;
    padding:15px 17px 15px 15px;border:0;cursor:pointer;
    border-radius:14px 0 0 14px;
    background:linear-gradient(135deg,#FF8A2B 0%,#E86C00 55%,#C2410C 100%);
    color:#fff;font:inherit;font-size:14px;font-weight:700;letter-spacing:.08em;
    box-shadow:-6px 10px 30px rgba(232,108,0,.45),inset 0 0 0 1px rgba(255,255,255,.22);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  #mapBtn:hover{transform:translateY(-50%) translateX(-5px);box-shadow:-9px 13px 38px rgba(232,108,0,.58),inset 0 0 0 1px rgba(255,255,255,.32)}
  #mapBtn svg{width:17px;height:17px;flex:none;opacity:.95}
  #mapBtn .pulse{
    width:6px;height:6px;border-radius:50%;background:#fff;flex:none;
    box-shadow:0 0 0 0 rgba(255,255,255,.65);animation:pulse 2.2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,255,255,.65)}
    70%{box-shadow:0 0 0 10px rgba(255,255,255,0)}
    100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}
  }
  @media (max-width:640px){
    #mapBtn{font-size:12px;padding:12px 13px 12px 11px;gap:7px}
    #langs{width:158px;height:30px;border-radius:11px}
    .lang-item{height:24px;padding:0 7px;font-size:11.5px}
    .lang-item.active{padding:0 8px}
  }

  #overlay{
    position:fixed;inset:0;z-index:400;
    display:flex;align-items:center;justify-content:center;
    background:rgba(9,23,45,.52);
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  #overlay.open{opacity:1;pointer-events:auto}
  #overlay.no-anim,#overlay.no-anim #mapPanel{transition:none!important}
  #mapPanel{
    width:92vw;height:90vh;max-width:1800px;
    background:#fff;border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 32px 90px rgba(6,18,38,.45);
    transform:scale(.975) translateY(6px);
    transition:transform .24s cubic-bezier(.2,.8,.3,1);
  }
  #overlay.open #mapPanel{transform:scale(1) translateY(0)}
  #mapPanel>header{
    flex:none;display:flex;align-items:center;gap:14px;
    padding:14px 18px;border-bottom:1px solid #e8edf5;
    background:linear-gradient(180deg,#fbfdff,#f5f8fc);
  }

<section id="north" class="anchor">
  <h2 class="section-title"><span class="sec-no">02</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg> 北向专题：境外主体参与国内期货的四大路径 </h2>
  <p class="section-desc">典型客户画像：境外持资管牌照机构、设立境内+境外双主体、暂无自有 QFII 额度，核心诉求为全品种、低延迟、快速落地。横向对比四类合规入场渠道：<b>境内直开 → 境外经纪 中转 → QFII → 北向 TRS</b>。</p>

  <div class="card">
    <h3>外资客群主体分类（WFOE / DI / QFII / TRS）</h3>
    <table class="tbl">
      <thead><tr><th>客群主体</th><th>全称</th><th>资金</th><th>投资范围</th><th>监管及职能机构</th></tr></thead>
      <tbody>
        <tr><td><b>WFOE</b></td><td>Wholly Foreign Owned Enterprise 外商独资企业（外资境内实体）</td><td>在岸</td><td class="hl">全品种</td><td>工商局、证监会、外管局、中期协、交易所、税务局</td></tr>
        <tr><td><b>DI</b></td><td>Direct Investor 境外投资者（境外主体直接开户）</td><td>离岸</td><td>24 个品种（期货 15 + 期权 9）</td><td>证监会、交易所</td></tr>
        <tr><td><b>QFII</b></td><td>Qualified Foreign Institutional Investor 合格境外投资者</td><td>离岸</td><td>75 个品种（期货 42 + 期权 33，2025/03 扩容后）</td><td>证监会、外管局、人民银行、交易所</td></tr>
        <tr><td><b>TRS</b></td><td>Total Return Swap 收益互换</td><td>离岸</td><td class="hl">全品种</td><td>证监会</td></tr>
      </tbody>
    </table>
    <div class="note"><span class="nt">QFII 家数：</span>截止 2024/12 共 <b>858 家</b>，主要注册地：中国香港 301 家、美国、新加坡、英国、韩国、中国台湾、日本等（证监会官网可查备案名单）。WFOE 为外资在境内设立的实体，可在岸参与全品种交易，常与境外母公司的 QFII/DI 账户搭配使用。</div>
  </div>

  <div class="card">
    <h3>四大路径对比总表</h3>
    <table class="tbl">
      <thead><tr><th>维度</th><th>路径① 境内直开</th><th>路径② 境外经纪 中转</th><th>路径③ QFII</th><th>路径④ 北向 TRS</th></tr></thead>
      <tbody>
        <tr><td>机制</td><td>境外主体直接在境内期货公司开户</td><td>境外经纪机构（香港持牌机构/OI 境外中介）中转开户</td><td>境外机构申请证监会 QFII 牌照</td><td>场外收益互换挂钩境内品种</td></tr>
        <tr><td>品种覆盖</td><td class="hl">仅 30+ 国际化特定品种</td><td>同左（与直开完全一致）</td><td class="hl">超 100 个全品种（最优）</td><td>挂钩品种灵活丰富</td></tr>
        <tr><td>落地速度</td><td class="hl">极快（无监管审批）</td><td>快</td><td>3–6 个月</td><td>签约后 3–6 周</td></tr>

        <tr><td>综合成本</td><td>低</td><td>低</td><td>托管费+代理</td><td class="hl">高（点差+资金成本）</td></tr>

  <div class="card">
    <h3>南向客户落地流程：从想法到大规模出海</h3>
    <p style="font-size:13.5px;color:var(--sub);margin-bottom:14px">客户出海完整路径：模拟验证 → 实盘试水 → 资金大规模出海，分三步走。</p>
    <div class="steps">
      <div class="step"><div class="st">第一步 · 模拟验证</div><div class="sd">客户有想法 → 创建策略 → 模拟盘测试</div><div class="stx">通过经纪机构申请模拟交易账号（配套主流量化交易软件等），先在模拟环境验证策略可行性</div></div>
      <div class="step"><div class="st">第二步 · 实盘试水</div><div class="sd">模拟测试成功后进入实盘</div><div class="stx">用落地成本较低的方式验证实操：<b>TRS</b>（场外互换）或 <b>QD</b>（QDII 额度通道）</div></div>
      <div class="step"><div class="st">第三步 · 大规模出海</div><div class="sd">实盘验证可行后资金批量出境</div><div class="stx">三种方式：借用现成牌照通道 / 离岸架构发基金 / 自申 9 号牌</div></div>
    </div>
    <h4><span class="n">三</span>第三步：资金大规模出海的三种方式</h4>
    <table class="tbl">
      <tr><th>方式</th><th>机制</th><th>特点</th></tr>
      <tr><td><b>① 借用现成牌照通道</b></td><td>针对已持有 9 号牌的主体，通过其现有通道完成投资</td><td>落地最快；需支付通道费用；依赖合作方资质</td></tr>
      <tr><td><b>② 离岸架构发基金</b></td><td>成立 BVI / 开曼群岛公司架构，通过该公司与持有 9 号牌的金融机构合作，<b>发行一只基金</b></td><td>架构规范、可自主运营；搭建周期与成本适中</td></tr>
      <tr><td><b>③ 自申 9 号牌</b></td><td>自己申请香港资产管理牌照</td><td>当前周期约 <b>1 年</b>，较漫长；自主可控、长期成本最优</td></tr>
    </table>
    
  </div>


  <div class="card">
    <h3>境外交易资金路径与TRS 交易商通道（含权贸易场景）</h3>
    <h4><span class="n">一</span>场内 vs 场外</h4>
    <table class="tbl">
      <tr><th>业务类型</th><th>对接机构</th><th>说明</th></tr>
      <tr><td><b>场内业务</b></td><td>境外期货机构</td><td>由境外期货机构承接</td></tr>
      <tr><td><b>场外业务</b></td><td>境外证券机构</td><td>须通过境外证券机构承接——期货机构无场外权限<b></b></td></tr>
    </table>
    <h4><span class="n">二</span>人民币做境外品种场内 → TRS 交易商（三个直通品种）</h4>
    <p>客户用人民币做境外品种场内交易（如 LME、COMEX 金等）时，对接<b>TRS 交易商</b>。TRS 交易商有三个<b>直接打通</b>的品种，可做场内，<b>手续费明显低于其他渠道</b>：</p>
    <div class="stat-row">
      <div class="stat"><div class="num">布伦特原油</div><div class="lbl">TRS 交易商直通 · 场内</div></div>
      <div class="stat"><div class="num">美国 2 号棉花</div><div class="lbl">ICE · TRS 交易商直通 · 场内</div></div>
      <div class="stat"><div class="num">新加坡铁矿石</div><div class="lbl">新交所 · TRS 交易商直通 · 场内</div></div>
    </div>
    <h4><span class="n">三</span>人民币做其他品种（如黄金）→ 场外结构</h4>
    <ul>
      <li>人民币做黄金等未直通品种时，采用<b>场外收益互换结构处理，达到相近</b>效果</li>
      <li><b>成本高于场内直通</b></li>
    </ul>
    <h4><span class="n">四</span>监管要求</h4>
    <div class="note danger"><span class="nt">禁止：</span>境内人民币<b>不允许做人民币外汇</b>（国内禁止炒外汇），须明确告知客户。</div>
  </div>

</section>

<!-- ================= 06 税务专题 ================= -->
<section id="tax" class="anchor">
  <h2 class="section-title"><span class="sec-no">05</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21V10"/><path d="M12 21V4"/><path d="M18 21v-7"/></svg> 税务专题 </h2>
  <p class="section-desc">"股票不交税、商品留存 10%"——<b>股票免税的是转让差价所得税</b>（股息红利仍 10% 预提）；<b>商品期货盈利缺乏免税文件</b>，实务按 10% 预提所得税处理。以下为完整税负地图。</p>

  <div class="card">
    <h3>税负地图：资产类型 × 税种</h3>
    <table class="tbl">
      <thead><tr><th>资产 / 交易</th><th>所得税（差价/盈利）</th><th>股息 / 红利 / 利息</th><th>增值税</th><th>印花税</th></tr></thead>
      <tbody>
        <tr><td><b>A股（QFII / 陆股通）</b></td><td><span class="tag g">暂免</span>（财税〔2014〕79号 / 81号）</td><td><span class="tag y">10%</span> 预提（QFII 可协定降；陆股通固定）</td><td><span class="tag g">免征</span>差价</td><td><span class="tag y">0.05%</span> 卖出</td></tr>
        <tr><td><b>商品期货（QFII / 境外交易者）</b></td><td><span class="tag r">10% 预提（实务）</span> 无免税文件，期货公司代扣（各地口径有差异）</td><td>—</td><td>实物交割 <span class="tag y">13%</span>；<b>保税交割免征</b></td><td>—</td></tr>
        <tr><td><b>金融期货（股指/国债）</b></td><td>无明确免税，实务同商品期货（口径待明确）</td><td>—</td><td>金融商品转让 <span class="tag y">6%</span>（个人免）</td><td>—</td></tr>
        <tr><td><b>TRS 结算款</b></td><td><span class="tag b">通常不缴</span>（存在穿透风险）</td><td>分红并入总收益结算</td><td>交易商承担计入报价</td><td>交易商承担计入报价</td></tr>
        <tr><td><b>债券（境外机构）</b></td><td>差价按非居民规则（无专门免税）</td><td><span class="tag g">利息暂免</span>（延续至 2025/12/31，以最新公告为准）</td><td><span class="tag g">利息免</span></td><td>—</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h3>税务判断决策树</h3>
    <div class="tree">
      <div class="tq">境外机构取得中国资产收益，这笔钱要交税吗？</div>
      <div class="branch">① 收益性质？ ② 哪个通道？ ③ 有无免税文件 / 协定？</div>
      <div class="tcols">
        <div class="tcol"><div class="th">股票转让差价</div>
          <div class="td">→ 陆股通 / QFI → <b>暂免所得税</b>（79/81/127号文）</div>
          <div class="td" style="margin-top:6px">→ TRS → 结算款，通常不缴（有不确定性）</div>
          <div class="td" style="margin-top:6px">→ 印花税：卖出 0.05%</div>
        </div>
        <div class="tcol"><div class="th">股息红利</div>
          <div class="td">→ 陆股通：<b>10% 固定代扣</b>，不适用协定</div>
          <div class="td" style="margin-top:6px">→ QFI：<b>10% 预提</b>，可申请协定税率（港资 ≥25% → 5%）</div>
          <div class="td" style="margin-top:6px">→ TRS：并入总收益，不单独扣缴</div>
        </div>
        <div class="tcol"><div class="th">期货交易盈利</div>
          <div class="td">→ <b>无免税文件</b>：实务按盈利 <b>10% 预提</b>代扣（各地不一）</div>
          <div class="td" style="margin-top:6px">→ 可主张协定待遇，实务认可度低</div>
          <div class="td" style="margin-top:6px">→ 实物交割：保税交割免增值税，普通交割 13%</div>
        </div>
        <div class="tcol"><div class="th">债券利息</div>
          <div class="td">→ <b>免征企业所得税 + 增值税</b>（政策延续中）</div>
          <div class="td" style="margin-top:6px">→ 国债利息本身免税</div>
          <div class="td" style="margin-top:6px">→ 债券转让差价：无专门免税，个案评估</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>三通道税务测算示例</h3>
    <div class="taxcase">
      <div class="tc-t">情景：外资机构持 A 股名义 1 亿市值，标的上涨 20%（+2000 万），期间分红 100 万，年末卖出</div>
      <table>
        <tr><td>税项</td><td>沪深港通</td><td>QFI（港资，持股≥25%）</td><td>TRS（名义本金 1 亿，费率 5%）</td></tr>
        <tr><td>价差 2000 万</td><td class="res">免所得税</td><td class="res">暂免企业所得税</td><td>支付 500 万资金成本后净收 1500 万（结算款，通常不缴中国税）</td></tr>
        <tr><td>分红 100 万</td><td>代扣 10 万</td><td>协定 5% → 预提 5 万</td><td>分红并入总收益结算（不单独扣缴）</td></tr>
        <tr><td>印花税</td><td>卖出 0.05% ≈ 5 万</td><td>≈ 5 万</td><td>交易商对冲承担，含在点差</td></tr>
        <tr><td>合计显性税负</td><td>约 15 万</td><td>约 10 万</td><td>名义 0，实际含在 5% 费率中（≈500 万成本）</td></tr>
      </table>
      <div class="src">结论：交易型（短持、快进快出）→ TRS 更优；配置型（长持、吃分红、要打新）→ QFI（协定税率）更优；个人与快速建仓 → 沪深港通。</div>
    </div>
  </div>

  <div class="card">
    <h3>"商品留存 10% 交税"实务要点</h3>
    <ul>
      <li>10% 是<b>实务代扣口径，具体适用以主管税务机关认定为准</b>：期货公司结算环节对境外客户平仓盈利按 10% 代扣预提所得税，剩余部分方可汇出</li>
      <li>各地税务机关对平仓盈利的预提处理存在差异，操作前建议先与主管税务机关确认代扣口径。</li>
      <li>实物交割环节：普通交割卖方缴增值税 13% 且开票困难 → 实务选择保税交割或平仓了结</li>
      <li>建议开户前与客户书面确认税务代扣口径</li>
    </ul>
  </div>
</section>

<section id="faq" class="anchor">
  <h2 class="section-title"><span class="sec-no">07</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.8 2.1c-.8.5-1.3 1-1.3 1.9"/><path d="M12 17h.01"/></svg> 常见问题 FAQ </h2>
  <div class="card">
    <details open><summary>TRS 和 QFII 的区别</summary><div class="faq-body">TRS：免牌照、品种灵活、本币结算，但延迟高、成本高，适合波段和配置型资金。QFII：全品种、低延迟、能打新，但审批 3–6 个月、有年限门槛，适合量化和长期资金。</div></details>
    <details open><summary>客户在银行结汇和期货套保之间选择</summary><div class="faq-body">场内点差通常少 100–160bp，节假日能交易，锁汇效率升水环境 304% vs 180%。银行渠道的优势在于可提供授信关系。</div></details>
    <details open><summary>QFI、QFII、RQFII 区别？</summary><div class="faq-body">旧制度两个名字（外币入市/人民币入市），2020年11月 合并成统一的 QFI，申请条件和投资范围一样，只剩资金币种的区别。统一称 QFI。</div></details>
  </div>

    <div class="tree">
      <div class="branch">Offshore institution → Northbound | Onshore institution/individual → Southbound</div>
      <div class="tcols">
        <div class="tcol"><div class="th">🌍 Offshore institutional clients (Northbound)</div>
          <div class="td"><b>Full range + low latency (quant/HFT) → QFII</b>: 100+ products, colocation supported; if the track-record requirement is not met → rent third-party QFII quota short term</div>
          <div class="tlink">Northbound · QFII</div>
          <div class="td" style="margin-top:8px"><b>Specific varieties only, need speed → direct onshore account</b>(30+ products, minimal paperwork) or offshore brokerage routing (Hong Kong access)</div>
          <div class="td" style="margin-top:8px"><b>No licence, need product flexibility → Northbound TRS</b></div>
        </div>
        <div class="tcol"><div class="th">🏭 Onshore industrial corporates (Southbound)</div>
          <div class="td"><b>Import/export or FX exposure → FX hedging</b>: HKEX USD/CNH futures (better than bank forwards)</div>
          <div class="tlink">Case study · FX hedging</div>
          <div class="td" style="margin-top:8px"><b>ODI filing completed → open a offshore brokerage account for the offshore entity</b>, hedge and trade overseas markets</div>
          <div class="td" style="margin-top:8px"><b>No offshore entity → Southbound TRS</b>(underwritten by a TRS dealer, funds stay onshore, high threshold)</div>
        </div>
        <div class="tcol"><div class="th">💰 Onshore private funds / financial institutions (Southbound)</div>

<!-- ================= 02 北向专题 ================= -->
<section id="north" class="anchor">
  <h2 class="section-title"><span class="sec-no">02</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg> Northbound: four routes for offshore entities trading domestic futures </h2>
  <p class="section-desc">Typical client profile: an offshore licensed asset manager with both onshore and offshore entities, no QFII quota of its own, whose priorities are full product coverage, low latency and fast execution. Four compliant channels compared side by side: <b>direct onshore → offshore brokerage routing → QFII → Northbound TRS</b>.</p>

  <div class="card">
    <h3>Offshore client entity types (WFOE / DI / QFII / TRS)</h3>
    <table class="tbl">
      <thead><tr><th>Entity type</th><th>Full name</th><th>Funding</th><th>Investment scope</th><th>Regulators and agencies</th></tr></thead>
      <tbody>
        <tr><td><b>WFOE</b></td><td>Wholly Foreign Owned Enterprise (foreign-owned onshore entity)</td><td>Onshore</td><td class="hl">Full product range</td><td>AMR, CSRC, SAFE, CFACH, exchanges, tax authorities</td></tr>
        <tr><td><b>DI</b></td><td>Direct Investor (offshore entity opening accounts directly)</td><td>Offshore</td><td>24 products (15 futures + 9 options)</td><td>CSRC, exchanges</td></tr>
        <tr><td><b>QFII</b></td><td>Qualified Foreign Institutional Investor</td><td>Offshore</td><td>75 products (42 futures + 33 options, after the March 2025 expansion)</td><td>CSRC, SAFE, PBOC, exchanges</td></tr>
        <tr><td><b>TRS</b></td><td>Total Return Swap</td><td>Offshore</td><td class="hl">Full product range</td><td>CSRC</td></tr>
      </tbody>
    </table>
    <div class="note"><span class="nt">QFII licensees: </span>as of 2024/12, <b>858 institutions</b>, mainly registered in Hong Kong (301), the US, Singapore, the UK, South Korea, Taiwan and Japan (the CSRC publishes the registered list). A WFOE is a foreign-owned onshore entity that can trade the full range onshore, often alongside the offshore parent's QFII/DI account.</div>
  </div>

  <div class="card">
    <h3>Comparison of the four routes</h3>
    <table class="tbl">
      <thead><tr><th>Dimension</th><th>① Direct onshore</th><th>② offshore brokerage routing</th><th>③ QFII</th><th>④ Northbound TRS</th></tr></thead>
      <tbody>
        <tr><td>Mechanism</td><td>Offshore entity opens an account directly with the company onshore</td><td>Routed through an offshore brokerage (HK licensed entity / OI)</td><td>Offshore institution applies to the CSRC for a QFII licence</td><td>OTC total return swap linked to onshore products</td></tr>
        <tr><td>Product coverage</td><td class="hl">Only 30+ internationalised specific varieties</td><td>Same (identical to direct access)</td><td class="hl">100+ products, full range (best)</td><td>Flexible, wide range of underlyings</td></tr>
        <tr><td>Time to launch</td><td class="hl">Very fast (no regulatory approval)</td><td>Fast</td><td>3–6 months</td><td>3–6 weeks after signing</td></tr>
        <tr><td>Latency</td><td>Colocation supported (low latency)</td><td>Normal</td><td>Normal</td><td class="hl">High latency (manual trading desk)</td></tr>
        <tr><td>Licence requirements</td><td>None</td><td>None</td><td>Hard requirements such as track record + custodian bank handling</td><td>None (professional institutional investors)</td></tr>
        <tr><td>Settlement</td><td>RMB funding</td><td>Via Hong Kong</td><td>Custodian bank, local and foreign currency</td><td class="hl">Settled in the client's home currency (no offshore remittance)</td></tr>
        <tr><td>Overall cost</td><td>Low</td><td>Low</td><td>Custody fee + agency fee</td><td class="hl">High (spread + funding cost)</td></tr>
        <tr><td>Best for</td><td>Short-term trading in specific varieties, speed</td><td>Offshore clients needing a Hong Kong point of contact</td><td>Quant/HFT, full range, long term</td><td>No licence, product flexibility, non-HFT</td></tr>
      </tbody>
    </table>
    <div class="note ok"><span class="nt">Underwriting note: </span>Route ④ Northbound TRS is underwritten by the dealer <b>an offshore securities firm</b>; the asset management business <b>does not hold a TRS licence</b>, so such requests are arranged separately. Route ③ QFII applications must be handled end-to-end by a custodian bank (onshore ICBC/ABC/BOC/CCB or offshore HSBC and other international banks); institutions cannot file with the CSRC directly.</div>
  </div>

  <div class="card">
    <h3>Route ①: offshore entity opens an account directly (specific varieties)</h3>
    <ul>
      <li><b>Tradable scope</b>: only the 30-plus internationalised specific varieties (crude oil, iron ore, PTA, TS20 rubber, international copper, palm oil, soybean complex, rapeseed complex, nickel, lithium carbonate, polyester chain, etc.)</li>
      <li><b>Core advantages</b>: minimal paperwork and the fastest route, with no regulatory approval wait; local colocation supported for low latency</li>
      <li><b>Drawbacks</b>: narrow product coverage, cannot meet full-category trading needs</li>
      <li><b>Best for</b>: clients trading only internationalised specific varieties short term, with no HFT or multi-category needs</li>
    </ul>
    <h4><span class="n">F</span>Account opening process (1–2 weeks)</h4>
    <div class="steps">
      <div class="step"><div class="st">Step 1</div><div class="sd">Document collection</div><div class="stx">Certificate of incorporation, articles of association, shareholding structure, audited financials, ID of beneficial owners</div></div>
      <div class="step"><div class="st">Step 2</div><div class="sd">Suitability review</div><div class="stx">KYC/AML and sanctions screening (entities in sanctioned, war-torn or FX-control jurisdictions cannot open accounts)</div></div>
      <div class="step"><div class="st">Step 3</div><div class="sd">Trading code</div><div class="stx">Apply for a dedicated overseas-client trading code by product</div></div>
      <div class="step"><div class="st">Step 4</div><div class="sd">Fund and trade</div><div class="stx">RMB funding; T+0 trading; optional demo account with standard quant software</div></div>
    </div>
  </div>

  <div class="card">
    <h3>Hard thresholds for offshore traders (all Northbound routes)</h3>
    <table class="tbl">
      <tr><th>Requirement</th><th>Detail</th></tr>
      <tr><td><b>Available funds</b></td><td>On each of the <b>5 trading days</b>before the trading-code application, the post-settlement available margin balance must be no less than <b>RMB 1 million</b> (crude oil has a separate rule: 1–2 trading days or FX equivalent, per the account-opening institution's latest requirement)</td></tr>
      <tr><td><b>Trading record</b> (any one of three)</td><td>① 10+ simulated trades on an onshore exchange's joint-test/simulation system; ② 10+ futures/options trades onshore or offshore in the past three years; ③ a certificate from the home regulator (10+ offshore trades in the past three years)</td></tr>
      <tr><td><b>Knowledge test</b></td><td>Futures suitability test score ≥ 80 (completed independently)</td></tr>
      <tr><td><b>Undertakings</b></td><td>Non-US person undertaking, offshore trader compliance and integrity undertaking, QFI undertaking</td></tr>
      <tr><td><b>Identity and funding</b></td><td>Front-facing photo of the account-opening agent (not an ID photo), ID documents, proof of available funds</td></tr>
    </table>
    <div class="note warn"><span class="nt">Marketing note: </span>The above are the exchanges'/monitoring centre's standard hard requirements; final approval rests with the account-opening institution's review. Documents can be pre-reviewed to avoid a longer cycle.</div>
  </div>

  <div class="card">
    <h3>Route ②: routed account via an offshore brokerage</h3>
    <ul>
      <li><b>How it works</b>: the Hong Kong licensed entity acts as an offshore brokerage intermediary; the regulatory rules and tradable permissions are <b>identical</b></li>
      <li><b> to direct account opening by the offshore entity </b>Tradable products</li>
      <li><b>Best for</b>: likewise limited to the 30-plus onshore internationalised specific varieties</li>
      <li><b>: offshore clients who cannot easily deal with an onshore futures company and need a local Hong Kong contact</b>offshore brokerage hard thresholds<b>: hold a compliant offshore entity certificate from Hong Kong, Singapore, etc.; </b>USD 550,000 equivalent<b> in proof of assets; a one-off or cumulative deposit of </b>USD 100,000 equivalent</li>
      <li><b> after opening to activate full trading permissions; entities in sanctioned, war-torn or FX-control jurisdictions  cannot open accounts; the offshore brokerage compliance review decision prevails </b>Trading system differences<b>: onshore proportional margin vs offshore </b>fixed margin</li>
    </ul>
  </div>

  <div class="card">
    <h3> (exchanges charge a fixed fee per lot, futures companies add a small markup; FX futures margin is about 2%–3% of contract value)</h3>
    <div class="kv">
      <dt>Route ③: QFII licence (best route for full coverage)</dt><dd>Approving authority</dd>
      <dt>CSRC; only offshore institutions may apply — onshore entities cannot </dt><dd><b>Filing requirement </b>Must be handled end-to-end by a custodian bank </dd>
      <dt>(onshore ICBC/ABC/BOC/CCB, offshore HSBC and other international banks); institutions cannot file directly with the CSRC</dt><dd>Approval timeline</dd>
      <dt>3–6 months; regulatory efficiency is currently high</dt><dd>Quota</dd>
      <dt>The CSRC assesses capital, business scale and years in operation; there is no fixed quota standard (quota limits were abolished in 2019)</dt><dd>Entity eligibility</dd>
    </div>
    <h4><span class="n">Offshore institutions face a hard track-record requirement</span>A</h4>
    <ul>
      <li><b>Product coverage</b>: access to 100+ onshore futures products, the widest coverage of any Northbound channel</li>
      <li><b>Low-latency trading</b>: QFII entities are treated as special onshore legal persons, so local colocation is allowed — suited to quant and HFT clients</li>
      <li><b>Two trading models</b>: proprietary trading or a dedicated QFII product to raise external money</li>
      <li><b>Full asset coverage</b>: beyond futures, equities, bonds, options, margin financing and IPO subscriptions (see the note after the tax section)</li>
    </ul>
    <h4><span class="n">P</span>Tradable products (75, after the 2025/03/04 expansion)</h4>
    <p style="font-size:13.5px;color:var(--sub);margin-bottom:8px">Total 75 = 42 futures + 33 options; on 2025/03/04, 15 futures and 14 options were added (all GFEX products opened). Further expansion continues; the exchanges' live list prevails.</p>
    <table class="tbl">
      <thead><tr><th>Exchange</th><th>Futures</th><th>Options</th><th>Representative products</th></tr></thead>
      <tbody>
        <tr><td>CFFEX</td><td>4</td><td>3</td><td>CSI 300, CSI 500, CSI 1000, SSE 50 (<b>hedging only</b>)</td></tr>
        <tr><td>SHFE</td><td>10</td><td>6</td><td>Gold, silver, copper, aluminium, zinc, rebar, hot-rolled coil, stainless steel, fuel oil, wood pulp</td></tr>
        <tr><td>INE</td><td>5</td><td>1</td><td>Crude oil, TS20 rubber, low-sulphur fuel oil, international copper, containerised freight index (Europe)</td></tr>
        <tr><td>DCE</td><td>10</td><td>10</td><td>No.1/No.2 soybeans, soybean meal, soybean oil, palm oil, iron ore, LLDPE, PP, PVC, styrene</td></tr>
        <tr><td>CZCE</td><td>10</td><td>10</td><td>PTA, methanol, white sugar, rapeseed oil, polyester staple fibre, PX, bottle chip, manganese silicon, rapeseed meal, peanuts</td></tr>

    <ul>
      <li><b>Onshore majors</b>: ICBC, ABC, BOC, CCB, Bank of Communications, @@the dealerBANK@@, China Merchants Bank, Everbright, Industrial Bank, SPDB, Minsheng, Ping An, Huaxia, Bank of Jiangsu, Bank of Ningbo, Zheshang Bank</li>

    <ul>
      <li>Model: work with an external QFII-licensed institution to set up a dedicated QFII product for the client</li>
      <li>Costs: product subscription fee + channel fee</li>
      <li>Advantage: fewer regulatory constraints than borrowing an onshore licence; a stopgap for clients without their own QFII quota</li>
    </ul>
  </div>

  <div class="card">
    <h3>Route ④: Northbound TRS (OTC channel)</h3>
    <ul>
      <li><b>Model</b>: the offshore client does not open a futures account onshore; an OTC swap links to onshore futures products and settlement is in the client's home currency</li>
      <li><b>Advantages</b>: no QFII licence needed; flexible and broad range of underlyings</li>
      <li><b>Core drawback</b>: no on-exchange low-latency trading — speed depends entirely on the trading desk's systems and manual handling, so latency is high and overall cost is higher</li>
      <li><b>Underwriting arrangement</b>: the dealer <b>an offshore securities firm</b> underwrites Northbound TRS; the asset management business does not hold such a licence, and such requests are arranged separately</li>
    </ul>
    <div class="note warn"><span class="nt">When it fits: </span>TRS suits clients insensitive to latency who want product flexibility and no offshore remittance; quant and HFT clients must use QFII or direct specific-variety access (colocation supported).</div>
  </div>

</section>

  <p class="section-desc">Onshore clients have <b>4 compliant routes</b>: ODI+offshore brokerage offshore account, Southbound TRS OTC swap, QDII/QDLP/QDIE, and the Hong Kong Type 9 licence. Natural persons are strictly restricted — a mainland ID bars direct offshore account opening; only a Hong Kong non-permanent resident ID is an exception.</p>

        </tr>

        </tr>

        </tr>
        <tr>

          <td>About 1 year for approval plus an annual fee; a borrowed licence can bridge the gap</td>

<!-- ================= 06 税务专题 ================= -->
<section id="tax" class="anchor">
  <h2 class="section-title"><span class="sec-no">05</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21V10"/><path d="M12 21V4"/><path d="M18 21v-7"/></svg> Tax </h2>
  <p class="section-desc">"No tax on equities, 10% retained on commodities" — <b>equities are exempt on capital gains</b> (dividends still subject to 10% withholding); <b>commodity futures profits have no exemption document</b> and are treated as 10% withholding in practice. The full tax map follows.</p>

  <div class="card">
    <h3>Tax map: asset type × tax</h3>
    <table class="tbl">
      <thead><tr><th>Asset / trade</th><th>Income tax (gains)</th><th>Dividends / interest</th><th>VAT</th><th>Stamp duty</th></tr></thead>
      <tbody>
        <tr><td><b>A-shares (QFII / Stock Connect)</b></td><td><span class="tag g">Temporarily exempt</span> (Cai Shui [2014] 79 / 81)</td><td><span class="tag y">10%</span> withholding (QFII may reduce under a treaty; Stock Connect is fixed)</td><td><span class="tag g">Exempt</span>Gains</td><td><span class="tag y">0.05%</span> on sale</td></tr>
        <tr><td><b>Commodity futures (QFII / offshore traders)</b></td><td><span class="tag r">10% withholding (practice)</span> — no exemption document; withheld by the futures company (local practice varies)</td><td>—</td><td>Physical delivery <span class="tag y">13%</span>; <b>bonded delivery exempt</b></td><td>—</td></tr>
        <tr><td><b>Financial futures (index / bonds)</b></td><td>No clear exemption; in practice the same as commodities (10%, treatment to be confirmed)</td><td>—</td><td>Transfer of financial products <span class="tag y">6%</span> (individuals exempt)</td><td>—</td></tr>
        <tr><td><b>TRS settlement</b></td><td><span class="tag b">Usually not taxed</span> (look-through risk exists)</td><td>Dividends rolled into total return</td><td>Dealer cost priced into the quote</td><td>Dealer cost priced into the quote</td></tr>
        <tr><td><b>Bonds (offshore institutions)</b></td><td>Gains under non-resident rules (no specific exemption)</td><td><span class="tag g">Interest temporarily exempt</span> (extended to 2025/12/31; latest announcements prevail)</td><td><span class="tag g">Interest exempt</span></td><td>—</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h3>Tax decision tree</h3>
    <div class="tree">
      <div class="tq">An offshore institution earns income on Chinese assets — is it taxable?</div>
      <div class="branch">① What is the nature of the income? ② Which channel? ③ Is there an exemption document / treaty?</div>
      <div class="tcols">
        <div class="tcol"><div class="th">Equity capital gains</div>
          <div class="td">→ Stock Connect / QFI → <b>income tax temporarily exempt</b> (Circulars 79/81/127)</div>
          <div class="td" style="margin-top:6px">→ TRS → settlement, usually not taxed (uncertainty remains)</div>
          <div class="td" style="margin-top:6px">→ stamp duty: 0.05% on sale</div>
        </div>
        <div class="tcol"><div class="th">Dividends</div>
          <div class="td">→ Stock Connect: <b>10% fixed withholding</b>, treaties do not apply</div>
          <div class="td" style="margin-top:6px">→ QFI: <b>10% withholding</b>, treaty rate may be claimed (HK holding ≥25% → 5%)</div>
          <div class="td" style="margin-top:6px">→ TRS: rolled into total return, no separate withholding</div>
        </div>
        <div class="tcol"><div class="th">Futures trading profits</div>
          <div class="td">→ <b>no exemption document</b>: in practice withheld on profits <b>10% withholding</b>(varies locally)</div>
          <div class="td" style="margin-top:6px">→ treaty relief may be claimed, but is rarely accepted</div>
          <div class="td" style="margin-top:6px">→ physical delivery: bonded delivery exempt from VAT, ordinary delivery 13%</div>
        </div>
        <div class="tcol"><div class="th">Bond interest</div>
          <div class="td">→ <b>Exempt from corporate income tax + VAT</b> (policy continues)</div>
          <div class="td" style="margin-top:6px">→ treasury bond interest is exempt in itself</div>
          <div class="td" style="margin-top:6px">→ bond capital gains: no specific exemption; case-by-case</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Three-channel tax illustration</h3>
    <div class="taxcase">
      <div class="tc-t">Scenario: a foreign institution holds A-shares with RMB 100 million market value, the stock rises 20% (+RMB 20 million), RMB 1 million of dividends during the period, sold at year-end</div>
      <table>
        <tr><td>Tax item</td><td>Stock Connect</td><td>QFI (HK, holding ≥25%)</td><td>TRS (notional RMB 100 million, 5% fee)</td></tr>
        <tr><td>RMB 20 million gain</td><td class="res">Income tax exempt</td><td class="res">Corporate income tax temporarily exempt</td><td>RMB 5 million funding cost paid, RMB 15 million net (settlement; usually no PRC tax)</td></tr>
        <tr><td>RMB 1 million dividends</td><td>RMB 100,000 withheld</td><td>Treaty 5% → RMB 50,000 withheld</td><td>Dividends rolled into total return (no separate withholding)</td></tr>
        <tr><td>Stamp duty</td><td>0.05% on sale ≈ RMB 50,000</td><td>≈ RMB 50,000</td><td>Borne by the dealer's hedge, inside the spread</td></tr>
        <tr><td>Total explicit tax</td><td>About RMB 150,000</td><td>About RMB 100,000</td><td>Nominally zero; embedded in the 5% fee (≈ RMB 5 million cost)</td></tr>
      </table>
      <div class="src">Conclusion: trading-oriented (short holding, fast in/out) → TRS; allocation-oriented (long holding, dividends, IPO subscriptions) → QFI (treaty rate); individuals and fast position building → Stock Connect.</div>
    </div>
  </div>

  <div class="card">
    <h3>"10% retained on commodities" in practice</h3>
    <ul>
      <li>The 10% is <b>the prevailing withholding practice, subject to the competent tax authority's determination</b>: at settlement the futures company withholds 10% income tax on offshore clients' closing profits, and only the balance may be remitted</li>
      <li>Local tax authorities treat withholding on closing profits differently; confirm the position with the competent authority before onboarding.</li>
      <li>Physical delivery: the seller pays 13% VAT and invoicing is difficult → in practice choose bonded delivery or close out</li>
      <li>Before opening an account, confirm the withholding basis with the client in writing to avoid later disputes</li>
    </ul>
  </div>
</section>

<!-- ================= 08 FAQ ================= -->
<section id="faq" class="anchor">
  <h2 class="section-title"><span class="sec-no">07</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.8 2.1c-.8.5-1.3 1-1.3 1.9"/><path d="M12 17h.01"/></svg> FAQ </h2>
  <div class="card">
    <details open><summary>TRS vs QFII</summary><div class="faq-body">TRS: no licence, flexible products, home-currency settlement, but high latency and cost — suits swing and allocation money. QFII: full products, low latency, IPO access, but 3–6 months approval and a track-record bar — suits quant and long-term money.</div></details>
    <details open><summary>Clients choosing between bank FX conversion and futures hedging</summary><div class="faq-body">On-exchange spreads are typically 100–160bp tighter, trading is possible on holidays, and hedging efficiency is 304% vs 180% in contango. The bank channel's advantage is the credit relationship.</div></details>
    <details open><summary>QFI vs QFII vs RQFII?</summary><div class="faq-body">The old regime had two names (FX entry / RMB entry); in November 2020 they merged into QFI, with the same conditions and scope, differing only in currency. Use QFI externally.</div></details>
  </div>
</section>

  <p class="section-desc">典型客戶畫像：境外持資管牌照機構、設立內地＋境外雙實體、暫無自有 QFII 額度，核心訴求係全市場、低延遲、快速落實。橫向對比四類合規入場渠道：<b>內地直開 → 境外經紀 中轉 → QFII → 北向 TRS</b>。</p>

  <div class="card">
    <h3>外資客群實體分類（WFOE／DI／QFII／TRS）</h3>
    <table class="tbl">
      <thead><tr><th>客群實體</th><th>全稱</th><th>資金</th><th>投資範圍</th><th>監管及職能機構</th></tr></thead>
      <tbody>
        <tr><td><b>WFOE</b></td><td>Wholly Foreign Owned Enterprise 外商獨資企業（外資內地實體）</td><td>在岸</td><td class="hl">全市場</td><td>工商局、證監會、外管局、中期協、交易所、稅務局</td></tr>
        <tr><td><b>DI</b></td><td>Direct Investor 境外投資者（境外實體直接開戶）</td><td>離岸</td><td>24 個品種（期貨 15 + 期權 9）</td><td>證監會、交易所</td></tr>
        <tr><td><b>QFII</b></td><td>Qualified Foreign Institutional Investor 合格境外投資者</td><td>離岸</td><td>75 個品種（期貨 42 + 期權 33，2025/03 擴容後）</td><td>證監會、外管局、人民銀行、交易所</td></tr>
        <tr><td><b>TRS</b></td><td>Total Return Swap 收益互換</td><td>離岸</td><td class="hl">全市場</td><td>證監會</td></tr>
      </tbody>
    </table>
    <div class="note"><span class="nt">QFII 家數：</span>截至 2024/12 共 <b>858 家</b>，主要註冊地：中國香港 301 家、美國、新加坡、英國、韓國、中國台灣、日本等（證監會官網有得查備案名單）。WFOE 係外資喺內地設立嘅實體，可以在岸參與全市場交易，通常同境外母公司嘅 QFII／DI 戶口搭配使用。</div>
  </div>

  <div class="card">
    <h3>四大路徑對比總表</h3>
    <table class="tbl">
      <thead><tr><th>維度</th><th>路徑① 內地直開</th><th>路徑② 境外經紀 中轉</th><th>路徑③ QFII</th><th>路徑④ 北向 TRS</th></tr></thead>
      <tbody>
        <tr><td>機制</td><td>境外實體直接喺公司內地開戶</td><td>境外經紀機構（香港持牌機構／OI 境外中介）中轉開戶</td><td>境外機構申請證監會 QFII 牌照</td><td>場外收益互換掛鈎內地品種</td></tr>

        <tr><td>延遲</td><td>支援數據中心託管（低延遲）</td><td>正常</td><td>正常</td><td class="hl">高延遲（靠交易台人手）</td></tr>
        <tr><td>牌照門檻</td><td>冇</td><td>冇</td><td>經營年限等硬門檻 + 託管銀行代辦</td><td>冇（專業機構投資者）</td></tr>
        <tr><td>資金結算</td><td>人民幣入金</td><td>經香港中轉</td><td>託管銀行本外幣</td><td class="hl">客戶本國貨幣結算（唔使出境外）</td></tr>
        <tr><td>綜合成本</td><td>低</td><td>低</td><td>託管費＋代理</td><td class="hl">高（點差＋資金成本）</td></tr>
        <tr><td>適用場景</td><td>短期淨係交易特定品種、求快</td><td>境外客戶要香港本地對接</td><td>量化／高頻、全市場、長期</td><td>冇牌照、品種靈活、非高頻</td></tr>
      </tbody>
    </table>
    <div class="note ok"><span class="nt">提示：</span>路徑④北向 TRS 要由具備場外互換資格嘅交易商承接。路徑③ QFII 申請一定要由託管銀行全程代辦（內地工農中建／境外恒生等國際投行），機構唔可以直接對接證監會。</div>

      <tr><td><b>② 離岸架構發基金</b></td><td>成立 BVI／開曼群島公司架構，透過呢間公司同持有 9 號牌嘅金融機構合作，<b>發行一隻基金</b></td><td>架構規範、可以自主營運；搭建週期同成本適中</td></tr>
      <tr><td><b>③ 自申 9 號牌</b></td><td>自己申請香港資產管理牌照</td><td>目前週期大約 <b>1 年</b>，比較漫長；自主可控、長期成本最優</td></tr>
    </table>
    <div class="note ok"><span class="nt"></span><b></b></div>
  </div>


  <div class="card">
    <h3>境外交易資金路徑同TRS 交易商通道（含權貿易場景）</h3>
    <h4><span class="n">1</span>場內 vs 場外</h4>
    <table class="tbl">
      <tr><th>業務類型</th><th>對接機構</th><th>說明</th></tr>
      <tr><td><b>場內業務</b></td><td>境外期貨機構</td><td>由境外期貨機構承接</td></tr>
      <tr><td><b>場外業務</b></td><td>境外證券機構</td><td>要經境外證券機構承接——期貨機構冇場外權限<b></b></td></tr>
    </table>
    <h4><span class="n">2</span>人民幣做境外品種場內 → TRS 交易商（三個直通品種）</h4>
    <p>客戶用人民幣做境外品種場內交易（例如 LME、COMEX 金等）時，對接 <b>TRS 交易商</b>。TRS 交易商有三個 <b>直接接通</b> 嘅品種，可以做場內，<b>手續費明顯低過其他渠道</b>：</p>
    <div class="stat-row">
      <div class="stat"><div class="num">布蘭特原油</div><div class="lbl">TRS 交易商直通 · 場內</div></div>
      <div class="stat"><div class="num">美國 2 號棉花</div><div class="lbl">ICE · TRS 交易商直通 · 場內</div></div>
      <div class="stat"><div class="num">新加坡鐵礦石</div><div class="lbl">新交所 · TRS 交易商直通 · 場內</div></div>
    </div>
    <h4><span class="n">3</span>人民幣做其他品種（例如黃金）→ 場外結構</h4>
    <ul>
      <li>人民幣做黃金等未直通品種時，採用 <b>場外收益互換結構處理，達到相近</b>效果</li>
      <li><b>成本高過場內直通</b></li>
    </ul>
    <h4><span class="n">4</span>監管要求</h4>
    <div class="note danger"><span class="nt">禁止：</span>內地人民幣 <b>唔允許做人民幣外匯</b>（國內禁止炒外匯），開戶時一定要明確話俾客戶知。</div>
  </div>

</section>

<section id="tax" class="anchor">

  <p class="section-desc">「股票唔交稅、商品留存 10%」——<b>股票免稅嘅係轉讓差價所得稅</b>（股息紅利照樣 10% 預提）；<b>商品期貨盈利冇免稅文件</b>，實務按 10% 預提所得稅處理。以下係完整稅負地圖。</p>

  <div class="card">
    <h3>稅負地圖：資產類型 × 稅種</h3>
    <table class="tbl">
      <thead><tr><th>資產／交易</th><th>所得稅（差價／盈利）</th><th>股息／紅利／利息</th><th>增值稅</th><th>印花稅</th></tr></thead>
      <tbody>
        <tr><td><b>A股（QFII／滬深港通）</b></td><td><span class="tag g">暫免</span>（財稅〔2014〕79號／81號）</td><td><span class="tag y">10%</span> 預提（QFII 可以按協定調低；滬深港通固定）</td><td><span class="tag g">免徵</span>差價</td><td><span class="tag y">0.05%</span> 賣出</td></tr>
        <tr><td><b>商品期貨（QFII／境外交易者）</b></td><td><span class="tag r">10% 預提（實務）</span> 冇免稅文件，期貨公司代扣（各地口徑有差異）</td><td>—</td><td>實物交割 <span class="tag y">13%</span>；<b>保稅交割免徵</b></td><td>—</td></tr>
        <tr><td><b>金融期貨（股指／國債）</b></td><td>冇明確免稅，實務同商品期貨一樣（口徑待明確）</td><td>—</td><td>金融商品轉讓 <span class="tag y">6%</span>（個人免）</td><td>—</td></tr>
        <tr><td><b>TRS 結算款</b></td><td><span class="tag b">通常唔繳</span>（存在穿透風險）</td><td>派息併入總收益結算</td><td>交易商承擔計入報價</td><td>交易商承擔計入報價</td></tr>

  <div class="card">
    <h3>稅務判斷決策樹</h3>
    <div class="tree">
      <div class="tq">境外機構取得中國資產收益，呢筆錢要唔要交稅？</div>
      <div class="branch">① 收益性質？ ② 邊個通道？ ③ 有冇免稅文件／協定？</div>
      <div class="tcols">
        <div class="tcol"><div class="th">股票轉讓差價</div>
          <div class="td">→ 滬深港通／QFI → <b>暫免所得稅</b>（79／81／127號文）</div>
          <div class="td" style="margin-top:6px">→ TRS → 結算款，通常唔繳（有唔確定性）</div>
          <div class="td" style="margin-top:6px">→ 印花稅：賣出 0.05%</div>
        </div>
        <div class="tcol"><div class="th">股息紅利</div>
          <div class="td">→ 滬深港通：<b>10% 固定代扣</b>，唔適用協定</div>
          <div class="td" style="margin-top:6px">→ QFI：<b>10% 預提</b>，可以申請協定稅率（港資持股 ≥25% → 5%）</div>
          <div class="td" style="margin-top:6px">→ TRS：併入總收益，唔單獨扣繳</div>
        </div>
        <div class="tcol"><div class="th">期貨交易盈利</div>
          <div class="td">→ <b>冇免稅文件</b>：實務按盈利 <b>10% 預提</b>代扣（各地唔一致）</div>
          <div class="td" style="margin-top:6px">→ 可以主張協定待遇，實務認可度低</div>
          <div class="td" style="margin-top:6px">→ 實物交割：保稅交割免增值稅，普通交割 13%</div>
        </div>
        <div class="tcol"><div class="th">債券利息</div>
          <div class="td">→ <b>免徵企業所得稅 + 增值稅</b>（政策延續中）</div>
          <div class="td" style="margin-top:6px">→ 國債利息本身免稅</div>
          <div class="td" style="margin-top:6px">→ 債券轉讓差價：冇專門免稅，個案評估</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>三通道稅務測算示例</h3>
    <div class="taxcase">
      <div class="tc-t">情景：外資機構持 A 股名義 1 億市值，標的升 20%（+2000 萬），期間派息 100 萬，年底賣出</div>
      <table>
        <tr><td>稅項</td><td>滬深港通</td><td>QFI（港資，持股 ≥25%）</td><td>TRS（名義本金 1 億，費率 5%）</td></tr>
        <tr><td>價差 2000 萬</td><td class="res">免所得稅</td><td class="res">暫免企業所得稅</td><td>支付 500 萬資金成本後淨收 1500 萬（結算款，通常唔繳中國稅）</td></tr>
        <tr><td>派息 100 萬</td><td>代扣 10 萬</td><td>協定 5% → 預提 5 萬</td><td>派息併入總收益結算（唔單獨扣繳）</td></tr>
        <tr><td>印花稅</td><td>賣出 0.05% ≈ 5 萬</td><td>≈ 5 萬</td><td>交易商對沖承擔，包含喺點差</td></tr>
        <tr><td>合計顯性稅負</td><td>大約 15 萬</td><td>大約 10 萬</td><td>名義 0，實際包含喺 5% 費率中（≈500 萬成本）</td></tr>
      </table>
      <div class="src">結論：交易型（短持、快入快出）→ TRS 更優；配置型（長持、收息、要抽新股）→ QFI（協定稅率）更優；個人同快速建倉 → 滬深港通。</div>
    </div>
  </div>

  <div class="card">
    <h3>「商品留存 10% 交稅」實務要點</h3>
    <ul>
      <li>10% 係 <b>實務代扣口徑，具體適用要以主管稅務機關認定為準</b>：期貨公司結算環節對境外客戶平倉盈利按 10% 代扣預提所得稅，剩低嘅部分先可以匯出</li>
      <li>各地稅務機關對平倉盈利嘅預提處理有差異，操作前建議先同主管稅務機關確認代扣口徑。</li>
      <li>實物交割環節：普通交割賣方繳增值稅 13% 而且開票困難 → 實務選擇保稅交割或者平倉了結</li>
      <li>建議開戶前同客戶書面確認稅務代扣口徑</li>
    </ul>
  </div>
</section>
