const MAP_DATA = {"zh":{"content":"公司跨境业务全景指南（北向 × 南向）","children":[{"content":"01 先判断方向：资金 / 客户要往哪里走？","children":[{"content":"北向：境外主体 → 中国境内市场","children":[{"content":"核心目标：参与中国境内证券、期货及衍生品市场","children":[]},{"content":"先看【境外主体是否需要直接持有境内市场头寸】","children":[{"content":"需要直接参与境内市场 → 再按投资范围、主体资质、速度选择通道","children":[]},{"content":"不需要直接开户 / 更重视灵活产品化 → 评估北向 TRS 等间接结构","children":[]}]}]},{"content":"南向：境内客户 / 资金 → 境外及全球市场","children":[{"content":"核心目标：境外投资、境外期货交易或跨境风险管理","children":[]},{"content":"第一分叉：是否已经具备合规境外主体","children":[{"content":"有境外主体 → 优先评估境外主体直接开户 / 境外经纪通道","children":[]},{"content":"无境外主体 → 再判断是否可以设立境外主体（如 ODI）","children":[]},{"content":"短期不设境外主体 → 评估 TRS 或持牌机构产品通道","children":[]}]}]}]},{"content":"02 北向：境外主体参与中国市场【决策树】","children":[{"content":"第一步：客户是否为合格境外主体？","children":[{"content":"境外机构 / 境外法人 → 可进一步评估特定品种、QFII、境外经纪机构等路径","children":[]},{"content":"境外自然人 → 仅在适用规则允许范围内评估特定品种等渠道；不能简单等同于机构通道","children":[]},{"content":"已有境内 WFOE → 属于境内主体路径，应与境外主体北向路径分开判断","children":[]}]},{"content":"第二步：需要交易什么？","children":[{"content":"仅交易对外开放的境内特定品种 → 优先考虑【境外交易者直接参与】或【境外经纪机构中转】","children":[]},{"content":"需要更广泛的境内证券 / 期货 / 期权投资范围 → 优先评估【QFII】","children":[]},{"content":"不以直接持有境内头寸为核心、需要定制化收益暴露 → 评估【北向 TRS】","children":[]}]},{"content":"路径 A｜境外交易者直接参与境内特定品种","children":[{"content":"结构：境外交易者 → 境内期货公司 / 交易所 → 境内特定品种","children":[]},{"content":"适用：交易需求集中于已对外开放的特定品种","children":[]},{"content":"优势：结构直接；直接获得境内市场参与资格；资金可按规定以外汇或人民币汇入","children":[]},{"content":"局限：投资范围受『特定品种』限制；开户、外汇、适当性等仍需满足监管及交易所规则","children":[]},{"content":"相对定位：『直接性强、落地效率较高、覆盖范围有限』","children":[]}]},{"content":"路径 B｜经境外经纪机构 / 香港中介机构参与","children":[{"content":"结构：境外交易者 → 境外经纪机构 → 境内期货公司或经批准直接入场","children":[]},{"content":"适用：客户已有熟悉的境外经纪服务体系，或希望通过境外中介统一接入","children":[]},{"content":"优势：客户服务与交易接口可保持境外化；便于跨境机构协同","children":[]},{"content":"局限：链条更长；中介资质、交易所批准及委托关系需逐项核实","children":[]},{"content":"相对定位：『服务便利性较强，但结构复杂度高于直接参与』","children":[]}]},{"content":"路径 C｜QFII（广覆盖型长期通道）","children":[{"content":"结构：境外机构 → QFII资格 → 境内托管人 / 资金账户 → 境内证券期货市场","children":[]},{"content":"适用：机构长期布局中国市场，需要更广泛资产类别和稳定市场准入","children":[]},{"content":"优势：投资范围总体更广；适合机构化、长期化、多资产配置","children":[]},{"content":"局限：仅适用于符合条件的境外机构；需要资格申请、托管及持续合规安排","children":[]},{"content":"核心对比：与特定品种路径相比『覆盖更广，但准入和运营安排更完整』","children":[]}]},{"content":"路径 D｜北向 TRS（间接收益暴露）","children":[{"content":"结构：客户 ↔ 合格承做机构 / 风险管理主体 → 以合约方式获得挂钩收益","children":[]},{"content":"适用：不希望自行取得境内直接准入，或需要策略打包、定制化收益结构","children":[]},{"content":"优势：产品化、灵活性强，可按客户需求定制收益暴露","children":[]},{"content":"局限：并非直接市场准入；存在对手方、估值、流动性、成本及适当性约束","children":[]},{"content":"核心对比：『灵活度高，但通常不适合追求最低延迟的直接高频交易』","children":[]}]},{"content":"北向路径横向比较","children":[{"content":"直接性：特定品种直入 ＞ 经境外经纪中转 ＞ QFII（直接投资但流程完整） ＞ TRS（合约暴露）","children":[]},{"content":"覆盖范围：QFII ＞ 视交易所开放范围的特定品种 / 经纪中转 ＞ TRS取决于产品可提供范围","children":[]},{"content":"落地速度：成熟直入路径通常较快；QFII资格及配套安排通常更长","children":[]},{"content":"灵活定制：TRS ＞ 经纪服务结构 ＞ 标准化直接开户","children":[]},{"content":"主要判断变量：投资范围｜主体资质｜是否已有境外牌照 / 经纪体系｜时效｜资金与账户安排｜交易频率","children":[]}]}]},{"content":"03 南向：境内客户走向全球市场【先看境外主体】","children":[{"content":"第一层：是否已有合规境外主体？","children":[{"content":"有境外主体","children":[{"content":"若主体已具备相应业务目的与开户条件 → 可直接评估境外经纪 / 境外经纪 等服务通道","children":[]},{"content":"优势：交易和账户结构相对直接；便于境外市场持续运营","children":[]},{"content":"注意：需核实境外主体设立背景、资金来源、跨境资金路径及当地监管要求","children":[]}]},{"content":"无境外主体","children":[{"content":"第二层：是否愿意 / 能够设立境外主体？","children":[]},{"content":"可以 → 评估 ODI 等合规对外投资安排 → 设立境外主体 → 再进行境外开户","children":[]},{"content":"不适合或短期无法设立 → 评估南向 TRS 或其他持牌机构产品通道","children":[]}]}]},{"content":"路径 A｜ODI / 境外主体 + 境外开户","children":[{"content":"结构：境内企业 → 合规境外投资安排 → 境外主体 → 境外经纪 / 交易账户","children":[]},{"content":"适用：产业企业或机构有长期境外经营、投资或风险管理需求","children":[]},{"content":"优势：长期结构清晰；便于持续开展境外业务","children":[]},{"content":"局限：前期设立与备案 / 核准、资金出境及持续合规成本较高","children":[]},{"content":"核心对比：『长期最稳健，但前期准备较重』","children":[]}]},{"content":"路径 B｜南向 TRS（无境外主体时的重要备选）","children":[{"content":"结构：境内合格客户 ↔ 境内 / 境外合格承做主体 → 获得境外标的收益暴露","children":[]},{"content":"适用：不希望直接设立境外主体，或短期需要境外市场风险暴露","children":[]},{"content":"优势：可减少客户自行直接进入境外市场的操作链条；产品可定制","children":[]},{"content":"局限：客户准入、产品适当性、对手方风险和成本是核心约束","children":[]},{"content":"核心对比：『启动灵活，但不等于客户直接拥有境外账户』","children":[]}]},{"content":"路径 C｜QDII（持牌机构境外投资通道）","children":[{"content":"适用：具有相应资格和额度的银行、基金、证券、保险、信托等持牌机构","children":[]},{"content":"优势：制度化、标准化的境外投资通道","children":[]},{"content":"局限：主体资格、产品范围及额度管理存在约束","children":[]},{"content":"定位：『持牌金融机构的标准化南向通道』","children":[]}]},{"content":"路径 D｜QDLP / QDIE 等试点通道","children":[{"content":"适用：符合试点地区及相关监管规则的管理人 / 基金产品","children":[]},{"content":"优势：面向专业机构资金跨境配置，结构较灵活","children":[]},{"content":"局限：具有地域试点、额度及主体资格约束","children":[]},{"content":"定位：『专业资管机构的试点型通道，不宜简单等同于普遍适用渠道』","children":[]}]},{"content":"路径 E｜香港持牌资管结构（如 9 号牌）","children":[{"content":"适用：拟长期在香港开展资产管理业务并满足当地牌照要求的机构","children":[]},{"content":"优势：可形成长期境外资管平台","children":[]},{"content":"局限：牌照、人员、资本、合规与持续监管要求较高","children":[]},{"content":"定位：『业务平台型方案，而非单次交易的快捷通道』","children":[]}]},{"content":"南向路径横向比较","children":[{"content":"已有境外主体：直接境外开户通常优先","children":[]},{"content":"无境外主体但长期出海：ODI + 境外主体更适合","children":[]},{"content":"无境外主体且短期需要收益暴露：TRS更具灵活性","children":[]},{"content":"持牌金融机构：优先结合自身 QDII 等既有资格","children":[]},{"content":"专业私募 / 资管：结合 QDLP / QDIE 试点资格与香港平台安排评估","children":[]}]}]},{"content":"04 按客户类型匹配【避免把不同客户放在同一层】","children":[{"content":"境外机构客户 → 北向","children":[{"content":"仅特定品种 → 直入 / 境外经纪中转","children":[]},{"content":"长期、多资产、广覆盖 → QFII","children":[]},{"content":"定制收益暴露 → 北向 TRS","children":[]}]},{"content":"境内产业实体客户 → 南向","children":[{"content":"已有境外主体 → 境外主体直接开户 / 风险管理","children":[]},{"content":"无境外主体、长期境外布局 → ODI + 境外主体","children":[]},{"content":"无境外主体、短期风险暴露需求 → 南向 TRS","children":[]},{"content":"进出口真实套保需求 → 同时评估合规的外汇及境外衍生品风险管理方案","children":[]}]},{"content":"境内金融机构 / 资管机构 → 南向","children":[{"content":"已有 QDII 等资格 → 在许可范围内开展境外投资","children":[]},{"content":"符合地方试点 → 评估 QDLP / QDIE","children":[]},{"content":"拟建立香港资管平台 → 评估香港相关持牌结构","children":[]}]},{"content":"境内自然人","children":[{"content":"不作为上述机构跨境通道的简单平移对象","children":[]},{"content":"应按照个人跨境金融、外汇及当地开户规则单独判断","children":[]}]}]},{"content":"05 关键合规提示与信息来源","children":[{"content":"特定品种直入：证监会规则 + 交易所自律规则 + 外汇 / 账户管理要求","children":[]},{"content":"QFII：资格、托管、账户、投资范围和持续监管需整体判断","children":[]},{"content":"TRS：不是监管套利工具；需重点核实承做主体资质、客户适当性、标的范围和风险管理","children":[]},{"content":"ODI / QDII / QDLP / QDIE / 香港持牌结构：分别适用不同监管体系，不能因业务目标相同而混为一谈","children":[]},{"content":"地图中的『优劣』均为相对业务结构比较，不代表监管准入承诺；具体项目以最新监管规则、交易所规则及专业合规意见为准","children":[]}]}]},"en":{"content":"the company Cross-Border Business Guide (Northbound × Southbound)","children":[{"content":"01 Direction first: where are the funds / clients going?","children":[{"content":"Northbound: offshore entities → China onshore markets","children":[{"content":"Core objective: access China's onshore securities, futures and derivatives markets","children":[]},{"content":"First check: does the offshore entity need to hold onshore positions directly?","children":[{"content":"Yes, direct onshore participation → then choose a channel by investment scope, entity eligibility and speed","children":[]},{"content":"No direct account needed / prefer flexible product structures → assess indirect structures such as Northbound TRS","children":[]}]}]},{"content":"Southbound: onshore clients / capital → offshore and global markets","children":[{"content":"Core objective: offshore investment, offshore futures trading or cross-border risk management","children":[]},{"content":"First branch: is there already a compliant offshore entity?","children":[{"content":"Offshore entity in place → prioritise direct offshore account opening / offshore brokerage","children":[]},{"content":"No offshore entity → then assess whether one can be set up (e.g. via ODI)","children":[]},{"content":"No offshore entity in the short term → assess TRS or licensed-institution product channels","children":[]}]}]}]},{"content":"02 Northbound: offshore entities entering China's market 【decision tree】","children":[{"content":"Step 1: is the client an eligible offshore entity?","children":[{"content":"Offshore institution / legal person → can further assess specific varieties, QFII, offshore brokers and other routes","children":[]},{"content":"Offshore natural person → consider channels such as specific varieties only where the rules allow; not equivalent to institutional channels","children":[]},{"content":"Existing onshore WFOE → an onshore-entity route; assess separately from the offshore-entity Northbound route","children":[]}]},{"content":"Step 2: what needs to be traded?","children":[{"content":"Only onshore specific varieties open to foreign participation → prefer 【direct participation by offshore traders】 or 【routing via offshore brokers】","children":[]},{"content":"Broader onshore securities / futures / options coverage → prioritise 【QFII】","children":[]},{"content":"Customised return exposure rather than direct onshore positions → assess 【Northbound TRS】","children":[]}]},{"content":"Route A｜Offshore traders participating directly in onshore specific varieties","children":[{"content":"Structure: offshore trader → onshore futures company / exchange → onshore specific varieties","children":[]},{"content":"Best fit: trading concentrated in specific varieties already open to foreign participation","children":[]},{"content":"Strengths: direct structure; direct access to onshore market participation; funds may be remitted in FX or RMB as permitted","children":[]},{"content":"Limits: scope confined to 'specific varieties'; account opening, FX and suitability rules still apply","children":[]},{"content":"Positioning: 'most direct, relatively fast to implement, limited coverage'","children":[]}]},{"content":"Route B｜Access via offshore brokers / Hong Kong intermediaries","children":[{"content":"Structure: offshore trader → offshore broker → onshore futures company, or approved direct entry","children":[]},{"content":"Best fit: clients with an established offshore brokerage relationship, or wanting a single offshore access point","children":[]},{"content":"Strengths: client service and trading interfaces stay offshore; easier cross-border coordination","children":[]},{"content":"Limits: longer chain; intermediary eligibility, exchange approval and mandate relationships need item-by-item checks","children":[]},{"content":"Positioning: 'better service convenience, but structurally more complex than direct participation'","children":[]}]},{"content":"Route C｜QFII (broad-coverage, long-term channel)","children":[{"content":"Structure: offshore institution → QFII licence → onshore custodian / cash account → onshore securities and futures markets","children":[]},{"content":"Best fit: institutions building a long-term China allocation, needing broader asset classes and stable access","children":[]},{"content":"Strengths: generally broader investment scope; suits institutional, long-term, multi-asset allocation","children":[]},{"content":"Limits: eligible offshore institutions only; requires licence application, custody and ongoing compliance","children":[]},{"content":"Key comparison: vs. specific varieties — 'broader coverage, but a fuller access and operating set-up'","children":[]}]},{"content":"Route D｜Northbound TRS (indirect return exposure)","children":[{"content":"Structure: client ↔ eligible counterparty / risk-management entity → linked return obtained contractually","children":[]},{"content":"Best fit: clients not wanting direct onshore access, or needing packaged strategies and tailored payoffs","children":[]},{"content":"Strengths: productised and highly flexible; exposure tailored to client needs","children":[]},{"content":"Limits: not direct market access; subject to counterparty, valuation, liquidity, cost and suitability constraints","children":[]},{"content":"Key comparison: 'high flexibility, but generally unsuitable for latency-sensitive direct HFT'","children":[]}]},{"content":"Northbound routes compared","children":[{"content":"Directness: specific varieties direct＞offshore broker routing＞QFII (direct investment, full process)＞TRS (contractual exposure)","children":[]},{"content":"Coverage: QFII＞specific varieties / broker routing (subject to exchange scope)＞TRS (depends on product scope)","children":[]},{"content":"Time to implement: established direct routes are usually faster; QFII licensing and support take longer","children":[]},{"content":"Flexibility: TRS＞brokerage structures＞standardised direct account opening","children":[]},{"content":"Key variables: investment scope｜entity eligibility｜existing offshore licence / brokerage set-up｜timing｜funding and account arrangements｜trading frequency","children":[]}]}]},{"content":"03 Southbound: onshore clients going global 【offshore entity first】","children":[{"content":"Tier 1: is there already a compliant offshore entity?","children":[{"content":"Offshore entity available","children":[{"content":"If the entity has the relevant business purpose and account-opening conditions → assess offshore brokerage / offshore brokerage and similar channels directly","children":[]},{"content":"Strengths: relatively direct trading and account structure; supports ongoing offshore operations","children":[]},{"content":"Watch: verify the entity's background, source of funds, cross-border funding path and local regulatory requirements","children":[]}]},{"content":"No offshore entity","children":[{"content":"Tier 2: willing and able to set up an offshore entity?","children":[]},{"content":"Yes → assess compliant outbound investment arrangements such as ODI → set up the offshore entity → then open offshore accounts","children":[]},{"content":"Not suitable or not feasible soon → assess Southbound TRS or other licensed-institution product channels","children":[]}]}]},{"content":"Route A｜ODI / offshore entity + offshore account","children":[{"content":"Structure: onshore company → compliant outbound investment arrangement → offshore entity → offshore broker / trading account","children":[]},{"content":"Best fit: industrial companies or institutions with long-term offshore operations, investment or hedging needs","children":[]},{"content":"Strengths: clear long-term structure; supports continuous offshore business","children":[]},{"content":"Limits: heavier upfront cost — incorporation, filing / approval, outbound remittance and ongoing compliance","children":[]},{"content":"Key comparison: 'most robust long term, but heavy upfront preparation'","children":[]}]},{"content":"Route B｜Southbound TRS (key alternative without an offshore entity)","children":[{"content":"Structure: eligible onshore client ↔ eligible onshore / offshore counterparty → exposure to offshore underlyings","children":[]},{"content":"Best fit: clients not wanting to set up an offshore entity, or needing offshore exposure in the short term","children":[]},{"content":"Strengths: shortens the client's own operational chain into offshore markets; product can be tailored","children":[]},{"content":"Limits: client eligibility, product suitability, counterparty risk and cost are the core constraints","children":[]},{"content":"Key comparison: 'flexible to start, but not the same as holding an offshore account'","children":[]}]},{"content":"Route C｜QDII (licensed-institution offshore investment channel)","children":[{"content":"Best fit: licensed banks, fund managers, securities firms, insurers and trusts with the relevant licence and quota","children":[]},{"content":"Strengths: institutionalised, standardised offshore investment channel","children":[]},{"content":"Limits: constraints on entity eligibility, product scope and quota management","children":[]},{"content":"Positioning: 'the standardised Southbound channel for licensed financial institutions'","children":[]}]},{"content":"Route D｜Pilot channels such as QDLP / QDIE","children":[{"content":"Best fit: managers / fund products meeting pilot-region and related regulatory requirements","children":[]},{"content":"Strengths: cross-border allocation for professional institutional capital; relatively flexible structure","children":[]},{"content":"Limits: regional pilot, quota and entity-eligibility constraints","children":[]},{"content":"Positioning: 'a pilot channel for professional asset managers, not a generally available route'","children":[]}]},{"content":"Route E｜Hong Kong licensed asset-management structure (e.g. Type 9 licence)","children":[{"content":"Best fit: institutions intending to run asset management in Hong Kong long term and meeting local licensing rules","children":[]},{"content":"Strengths: builds a long-term offshore asset-management platform","children":[]},{"content":"Limits: demanding licensing, staffing, capital, compliance and ongoing supervision","children":[]},{"content":"Positioning: 'a business-platform solution, not a quick route for a single trade'","children":[]}]},{"content":"Southbound routes compared","children":[{"content":"Offshore entity in place: direct offshore account opening usually comes first","children":[]},{"content":"No offshore entity, long-term offshore presence: ODI + offshore entity fits better","children":[]},{"content":"No offshore entity, short-term exposure needed: TRS is more flexible","children":[]},{"content":"Licensed financial institutions: start from existing QDII and similar qualifications","children":[]},{"content":"Professional private funds / asset managers: assess QDLP / QDIE pilot status together with a Hong Kong platform","children":[]}]}]},{"content":"04 Matching by client type 【don't put different clients on one layer】","children":[{"content":"Offshore institutional clients → Northbound","children":[{"content":"Specific varieties only → direct entry / offshore broker routing","children":[]},{"content":"Long-term, multi-asset, broad coverage → QFII","children":[]},{"content":"Customised return exposure → Northbound TRS","children":[]}]},{"content":"Onshore industrial corporates → Southbound","children":[{"content":"Offshore entity in place → direct offshore account opening / risk management","children":[]},{"content":"No offshore entity, long-term offshore plan → ODI + offshore entity","children":[]},{"content":"No offshore entity, short-term exposure need → Southbound TRS","children":[]},{"content":"Genuine import/export hedging needs → also assess compliant FX and offshore derivatives risk-management solutions","children":[]}]},{"content":"Onshore financial / asset-management institutions → Southbound","children":[{"content":"QDII or similar licence in place → invest offshore within the permitted scope","children":[]},{"content":"Eligible for local pilots → assess QDLP / QDIE","children":[]},{"content":"Planning a Hong Kong asset-management platform → assess the relevant licensed structure","children":[]}]},{"content":"Onshore natural persons","children":[{"content":"Not a simple extension of the institutional cross-border channels above","children":[]},{"content":"Assess separately under personal cross-border finance, FX and local account-opening rules","children":[]}]}]},{"content":"05 Key compliance notes and sources","children":[{"content":"Direct access to specific varieties: CSRC rules + exchange self-regulatory rules + FX / account-management requirements","children":[]},{"content":"QFII: licence, custody, accounts, investment scope and ongoing supervision must be assessed as a whole","children":[]},{"content":"TRS: not a regulatory-arbitrage tool; verify counterparty eligibility, client suitability, underlying scope and risk management","children":[]},{"content":"ODI / QDII / QDLP / QDIE / Hong Kong licensed structures: each sits under a different regulatory regime and must not be conflated just because the objective is similar","children":[]},{"content":"The 'pros and cons' here are relative structural comparisons, not commitments on regulatory access; each deal is governed by the latest regulatory rules, exchange rules and professional compliance opinions","children":[]}]}]},"yue":{"content":"公司跨境業務全景指南（北向 × 南向）","children":[{"content":"01 先睇方向：資金／客戶要走去邊？","children":[{"content":"北向：境外實體 → 中國內地市場","children":[{"content":"核心目標：參與中國內地證券、期貨同衍生品市場","children":[]},{"content":"先睇【境外實體使唔使自己直接揸內地市場倉位】","children":[{"content":"要直接參與內地市場 → 再按投資範圍、實體資格、速度揀通道","children":[]},{"content":"唔使直接開戶／更重視靈活產品化 → 睇北向 TRS 等間接結構","children":[]}]}]},{"content":"南向：內地客戶／資金 → 境外同全球市場","children":[{"content":"核心目標：境外投資、境外期貨交易或者跨境風險管理","children":[]},{"content":"第一個分岔：有冇已經合規嘅境外實體","children":[{"content":"有境外實體 → 優先睇境外實體直接開戶／境外經紀通道","children":[]},{"content":"冇境外實體 → 再睇可唔可以設立境外實體（例如 ODI）","children":[]},{"content":"短期唔設立境外實體 → 睇 TRS 或者持牌機構嘅產品通道","children":[]}]}]}]},{"content":"02 北向：境外實體參與中國市場【決策樹】","children":[{"content":"第一步：客戶係咪合格境外實體？","children":[{"content":"境外機構／境外法人 → 可以再睇特定品種、QFII、境外經紀機構等路徑","children":[]},{"content":"境外自然人 → 只喺適用規則容許嘅範圍內睇特定品種等渠道；唔可以簡單當成機構通道","children":[]},{"content":"已經有內地 WFOE → 屬於內地實體路徑，要同境外實體嘅北向路徑分開判斷","children":[]}]},{"content":"第二步：要交易啲咩？","children":[{"content":"只做對外開放嘅內地特定品種 → 優先考慮【境外交易者直接參與】或者【境外經紀機構中轉】","children":[]},{"content":"要更闊嘅內地證券／期貨／期權投資範圍 → 優先睇【QFII】","children":[]},{"content":"唔以直接揸內地倉位為核心、要度身訂造收益敞口 → 睇【北向 TRS】","children":[]}]},{"content":"路徑 A｜境外交易者直接參與內地特定品種","children":[{"content":"結構：境外交易者 → 內地期貨公司／交易所 → 內地特定品種","children":[]},{"content":"適用：交易需求集中喺已經對外開放嘅特定品種","children":[]},{"content":"優勢：結構直接；直接攞到內地市場參與資格；資金可以按規定用外匯或者人民幣匯入","children":[]},{"content":"局限：投資範圍受『特定品種』限制；開戶、外匯、合適性等仲要符合監管同交易所規則","children":[]},{"content":"相對定位：『直接性強、執行效率較高、覆蓋範圍有限』","children":[]}]},{"content":"路徑 B｜經境外經紀機構／香港中介機構參與","children":[{"content":"結構：境外交易者 → 境外經紀機構 → 內地期貨公司，或者經批准直接入場","children":[]},{"content":"適用：客戶已經有熟嘅境外經紀服務體系，或者想經境外中介統一接入","children":[]},{"content":"優勢：客戶服務同交易接口可以保持境外化；方便跨境機構協同","children":[]},{"content":"局限：條鏈更長；中介資格、交易所批准同委託關係要逐項核實","children":[]},{"content":"相對定位：『服務便利性較強，但結構複雜過直接參與』","children":[]}]},{"content":"路徑 C｜QFII（闊覆蓋型長期通道）","children":[{"content":"結構：境外機構 → QFII 資格 → 內地託管人／資金賬戶 → 內地證券期貨市場","children":[]},{"content":"適用：機構長期佈局中國市場，要更闊嘅資產類別同穩定嘅市場準入","children":[]},{"content":"優勢：投資範圍整體更闊；適合機構化、長期化、多資產配置","children":[]},{"content":"局限：只適用於符合條件嘅境外機構；要申請資格、託管同持續合規安排","children":[]},{"content":"核心對比：同特定品種路徑比，『覆蓋更闊，但準入同營運安排更完整』","children":[]}]},{"content":"路徑 D｜北向 TRS（間接收益敞口）","children":[{"content":"結構：客戶 ↔ 合格承接機構／風險管理實體 → 用合約方式攞掛鈎收益","children":[]},{"content":"適用：唔想自己攞內地直接準入，或者要策略打包、度身訂造收益結構","children":[]},{"content":"優勢：產品化、靈活性強，可以按客戶需求訂造收益敞口","children":[]},{"content":"局限：唔係直接市場準入；有對手方、估值、流動性、成本同合適性約束","children":[]},{"content":"核心對比：『靈活度高，但一般唔適合追求最低延遲嘅直接高頻交易』","children":[]}]},{"content":"北向路徑橫向比較","children":[{"content":"直接性：特定品種直入 ＞ 經境外經紀中轉 ＞ QFII（直接投資但流程完整） ＞ TRS（合約敞口）","children":[]},{"content":"覆蓋範圍：QFII ＞ 睇交易所開放範圍嘅特定品種／經紀中轉 ＞ TRS 視乎產品可以提供咩範圍","children":[]},{"content":"推行速度：成熟嘅直入路徑通常較快；QFII 資格同配套安排通常更長","children":[]},{"content":"靈活訂造：TRS ＞ 經紀服務結構 ＞ 標準化直接開戶","children":[]},{"content":"主要判斷變數：投資範圍｜實體資格｜有冇境外牌照／經紀體系｜時效｜資金同賬戶安排｜交易頻率","children":[]}]}]},{"content":"03 南向：內地客戶走向全球市場【先睇境外實體】","children":[{"content":"第一層：有冇已經合規嘅境外實體？","children":[{"content":"有境外實體","children":[{"content":"如果實體已經有相應業務目的同開戶條件 → 可以直接睇境外經紀／境外經紀 等服務通道","children":[]},{"content":"優勢：交易同賬戶結構相對直接；方便喺境外市場持續營運","children":[]},{"content":"注意：要核實境外實體嘅設立背景、資金來源、跨境資金路徑同當地監管要求","children":[]}]},{"content":"冇境外實體","children":[{"content":"第二層：願唔願意／能唔能夠設立境外實體？","children":[]},{"content":"可以 → 睇 ODI 等合規對外投資安排 → 設立境外實體 → 再去做境外開戶","children":[]},{"content":"唔適合或者短期做唔到 → 睇南向 TRS 或者其他持牌機構嘅產品通道","children":[]}]}]},{"content":"路徑 A｜ODI／境外實體 + 境外開戶","children":[{"content":"結構：內地企業 → 合規境外投資安排 → 境外實體 → 境外經紀／交易賬戶","children":[]},{"content":"適用：產業企業或者機構有長期境外經營、投資或者風險管理需求","children":[]},{"content":"優勢：長期結構清晰；方便持續開展境外業務","children":[]},{"content":"局限：前期設立同備案／核准、資金出境同持續合規成本較高","children":[]},{"content":"核心對比：『長期最穩陣，但前期準備較重』","children":[]}]},{"content":"路徑 B｜南向 TRS（冇境外實體時嘅重要備選）","children":[{"content":"結構：內地合格客戶 ↔ 內地／境外合格承接實體 → 攞到境外標的嘅收益敞口","children":[]},{"content":"適用：唔想直接設立境外實體，或者短期要境外市場風險敞口","children":[]},{"content":"優勢：可以減少客戶自己直接入境外市場嘅操作鏈條；產品可以訂造","children":[]},{"content":"局限：客戶準入、產品合適性、對手方風險同成本係核心約束","children":[]},{"content":"核心對比：『起步靈活，但唔等於客戶直接有境外賬戶』","children":[]}]},{"content":"路徑 C｜QDII（持牌機構境外投資通道）","children":[{"content":"適用：有相應資格同額度嘅銀行、基金、證券、保險、信託等持牌機構","children":[]},{"content":"優勢：制度化、標準化嘅境外投資通道","children":[]},{"content":"局限：實體資格、產品範圍同額度管理都有約束","children":[]},{"content":"定位：『持牌金融機構嘅標準化南向通道』","children":[]}]},{"content":"路徑 D｜QDLP／QDIE 等試點通道","children":[{"content":"適用：符合試點地區同相關監管規則嘅管理人／基金產品","children":[]},{"content":"優勢：針對專業機構資金做跨境配置，結構較靈活","children":[]},{"content":"局限：有地域試點、額度同實體資格約束","children":[]},{"content":"定位：『專業資管機構嘅試點型通道，唔應該簡單當成通行渠道』","children":[]}]},{"content":"路徑 E｜香港持牌資管結構（例如 9 號牌）","children":[{"content":"適用：打算長期喺香港做資產管理業務，同時符合當地牌照要求嘅機構","children":[]},{"content":"優勢：可以建立長期境外資管平台","children":[]},{"content":"局限：牌照、人員、資本、合規同持續監管要求較高","children":[]},{"content":"定位：『業務平台型方案，唔係單次交易嘅捷徑』","children":[]}]},{"content":"南向路徑橫向比較","children":[{"content":"已經有境外實體：直接喺境外開戶通常優先","children":[]},{"content":"冇境外實體但長期出海：ODI + 境外實體更啱","children":[]},{"content":"冇境外實體而短期要有收益敞口：TRS 更靈活","children":[]},{"content":"持牌金融機構：優先結合自己已有嘅 QDII 等資格","children":[]},{"content":"專業私募／資管：結合 QDLP／QDIE 試點資格同香港平台安排去睇","children":[]}]}]},{"content":"04 按客戶類型配對【唔好將唔同客戶擺喺同一層】","children":[{"content":"境外機構客戶 → 北向","children":[{"content":"只做特定品種 → 直入／境外經紀中轉","children":[]},{"content":"長期、多資產、闊覆蓋 → QFII","children":[]},{"content":"訂造收益敞口 → 北向 TRS","children":[]}]},{"content":"內地產業實體客戶 → 南向","children":[{"content":"已經有境外實體 → 境外實體直接開戶／風險管理","children":[]},{"content":"冇境外實體、長期境外佈局 → ODI + 境外實體","children":[]},{"content":"冇境外實體、短期要有風險敞口 → 南向 TRS","children":[]},{"content":"進出口有真實套保需求 → 同時睇合規嘅外匯同境外衍生品風險管理方案","children":[]}]},{"content":"內地金融機構／資管機構 → 南向","children":[{"content":"已經有 QDII 等資格 → 喺許可範圍內做境外投資","children":[]},{"content":"符合地方試點 → 睇 QDLP／QDIE","children":[]},{"content":"打算建立香港資管平台 → 睇香港相關持牌結構","children":[]}]},{"content":"內地自然人","children":[{"content":"唔應該當成上述機構跨境通道嘅簡單照搬對象","children":[]},{"content":"要按個人跨境金融、外匯同當地開戶規則單獨判斷","children":[]}]}]},{"content":"05 關鍵合規提示同資料來源","children":[{"content":"特定品種直入：證監會規則 + 交易所自律規則 + 外匯／賬戶管理要求","children":[]},{"content":"QFII：資格、託管、賬戶、投資範圍同持續監管要整體判斷","children":[]},{"content":"TRS：唔係監管套利工具；要重點核實承接實體資格、客戶合適性、標的範圍同風險管理","children":[]},{"content":"ODI／QDII／QDLP／QDIE／香港持牌結構：各自適用唔同監管體系，唔可以因為業務目標一樣就撈埋一齊講","children":[]},{"content":"圖入面嘅『優劣』都係相對業務結構嘅比較，唔代表監管準入承諾；具體項目以最新監管規則、交易所規則同專業合規意見為準","children":[]}]}]}};

function fitWhenReady(tries) {
  const r = mm.state.rect;
  if (r && r.x2 - r.x1 > 1) { mm.fit(); return; }
  if ((tries || 0) < 25) setTimeout(() => fitWhenReady((tries || 0) + 1), 80);
}

function applyMapData() {
  // setData 内部会等布局完成再 autoFit，所以等它 resolve + transition 走完再决定视图
  const target = pendingFocus;
  pendingFocus = null;
  mm.setData(MAP_DATA[mapLang], { initialExpandLevel: -1 }).then(() => {
    setTimeout(() => {
      if (target) focusBranch(target);
      else mm.fit();
    }, 620);
  }).catch(() => { pendingFocus = target; fitWhenReady(0); });
}

// 正文各节 → 导图一级分支（按编号前缀匹配，三语通用）
const SECTION_BRANCH = {
  overview: null, north: "02", south: "03", cases: "04",
  internal: "05", tax: "06", pain: "04", faq: "06", refs: "06"
};

function currentSectionId() {
  // 用 getBoundingClientRect 而非 offsetTop：iCloud/嵌套容器下 offsetTop 会偏
  let cur = "overview";
  const line = window.scrollY + 150;
  document.querySelectorAll("#content section[id]").forEach(sec => {
    const top = sec.getBoundingClientRect().top + window.scrollY;
    if (line >= top) cur = sec.id;
  });
  return cur;
}

function subtreeBounds(node) {
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  (function walk(n) {
    const r = n.state && n.state.rect;
    if (r && (r.width || r.height)) {
      x1 = Math.min(x1, r.x); y1 = Math.min(y1, r.y);
      x2 = Math.max(x2, r.x + r.width); y2 = Math.max(y2, r.y + r.height);
    }
    (n.children || []).forEach(walk);
  })(node);
  return isFinite(x1) ? { x1, y1, x2, y2 } : null;
}

function focusBranch(prefix, tries) {
  if (!mm) return;
  if (!prefix) { mm.fit(); return; }
  tries = tries || 0;
  const node = (mm.state.data.children || []).find(c => c.content.trim().startsWith(prefix));
  const b = node && subtreeBounds(node);
  if (!b) {
    // 刚 setData 时布局还没算完，稍等再来
    if (tries < 32) setTimeout(() => focusBranch(prefix, tries + 1), 100);
    else mm.fit();
    return;
  }
  const svg = mm.svg.node();
  const W = svg.clientWidth, H = svg.clientHeight;
  const pad = 46;
  const fitScale = Math.min((W - pad * 2) / (b.x2 - b.x1), (H - pad * 2) / (b.y2 - b.y1));
  let t;
  if (fitScale >= 0.62) {
    // 该分支不大，整块居中铺满（限个上限，免得字太大）
    const sc = Math.min(fitScale, 1.15);
    t = d3.zoomIdentity
      .translate(W / 2 - (b.x1 + b.x2) / 2 * sc, H / 2 - (b.y1 + b.y2) / 2 * sc)
      .scale(sc);
  } else {
    // 分支很大：放大到可读，并把分支标题送到左上角，往下读
    const scale = 0.72;
    const r = node.state.rect;
    // 分支节点垂直居中，右侧展开它的子节点
    t = d3.zoomIdentity
      .translate(72 - r.x * scale, H / 2 - (r.y + r.height / 2) * scale)
      .scale(scale);
  }
  mm.svg.transition().duration(520).call(mm.zoom.transform, t);
}

function bindDoc() {
  topBtnEl = $("topBtn");
  if (topBtnEl) topBtnEl.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
  navLinks = Array.from(document.querySelectorAll("#topnav a"));
  secs = Array.from(document.querySelectorAll("section[id]"));
  updateBtnLabel();
}

function updateBtnLabel() {
  const m = META[current];
  $("mapBtnLabel").textContent = m.btn;
  document.title = m.title;
  $("abTitle").textContent = m.bannerTitle;
  $("abText").textContent = m.bannerText;
  $("anonBanner").title = m.bannerFull;
  $("mapTitle").textContent = m.mapTitle;
  $("mapHint").textContent = m.hint;
  document.documentElement.lang = m.lang;
  $("mapFocusLabel").textContent = m.focus;
  $("mapFit").textContent = m.fitAll;
  document.querySelectorAll(".lang-item").forEach(el => {
    const on = el.dataset.lang === current;
    el.classList.toggle("active", on);
    el.setAttribute("aria-current", on ? "true" : "false");
  });
}

function setLang(lang) {
  if (!META[lang]) return;
  const y = window.scrollY;
  current = lang;
  const tpl = $("doc-" + lang);
  $("content").innerHTML = tpl.innerHTML;
  bindDoc();
  updateBtnLabel();
  window.scrollTo(0, y);
  if (mm && mapLang !== lang) {
    mapLang = lang;
    ensureMap(true);         // 重建实例：换语言等同于重新加载图
    pendingFocus = $("overlay").classList.contains("open") ? SECTION_BRANCH[currentSectionId()] : null;
    applyMapData();
  }
  try { localStorage.setItem("cb-guide-lang", lang); } catch (e) {}
}

function ensureMap(force) {
  if (mm && !force) return;
  if (mm) { try { mm.destroy(); } catch (e) {} mm = null; }
  $("mapStage").querySelectorAll(".mm-toolbar").forEach(el => el.remove());
  mm = markmap.Markmap.create("#mindmap", MAP_OPTIONS, null);
  const bar = new markmap.Toolbar();
  bar.attach(mm);
  const el = bar.render();
  el.classList.add("mm-toolbar");
  el.style.cssText = "position:absolute;bottom:14px;right:14px";
  $("mapStage").appendChild(el);
}

function openMap() {
  $("overlay").classList.add("open");
  $("overlay").setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  mapLang = current;
  pendingFocus = SECTION_BRANCH[currentSectionId()];
  ensureMap();
  setTimeout(applyMapData, 70);
}

function closeMap() {
  $("overlay").classList.remove("open");
  $("overlay").setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

document.addEventListener("click", e => {
  const langBtn = e.target.closest("#langs .lang-item, #mapLangs .lang-item");
  if (langBtn) { setLang(langBtn.dataset.lang); return; }
  if (e.target.closest("#mapBtn")) { openMap(); return; }
  if (e.target.closest("#mapClose")) { closeMap(); return; }
  if (e.target.closest("#mapFocus")) {
    const btn = e.target.closest("#mapFocus");
    btn.classList.remove("ping"); void btn.offsetWidth; btn.classList.add("ping");
    setTimeout(() => btn.classList.remove("ping"), 650);
    focusBranch(SECTION_BRANCH[currentSectionId()]);
    return;
  }
  if (e.target.closest("#mapFit")) { if (mm) mm.fit(); return; }
  if (e.target.id === "overlay") { closeMap(); }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("overlay").classList.contains("open")) closeMap();
});

window.addEventListener("scroll", () => {
  if (topBtnEl) topBtnEl.classList.toggle("show", window.scrollY > 600);
  let cur = secs.length ? secs[0].id : null;
  for (const s of secs) { if (window.scrollY >= s.offsetTop - 120) cur = s.id; }
  navLinks.forEach(a => a.classList.toggle("cur", a.getAttribute("href") === "#" + cur));
}, { passive: true });

// 初始化语言
let initLang = new URLSearchParams(location.search).get("lang");
if (!META[initLang]) { try { initLang = localStorage.getItem("cb-guide-lang"); } catch (e) {} }
if (!META[initLang]) {
  const n = (navigator.language || "zh").toLowerCase();
  initLang = n.startsWith("zh") ? (/hant|hk|tw|mo/.test(n) ? "yue" : "zh") : "en";
}
setLang(initLang);

const qs = new URLSearchParams(location.search);
if (qs.get("debug") === "1") {
  let n = 0;
  const dbg = setInterval(() => {
    document.title = "DBG " + JSON.stringify({
      l: mapLang, r: mm && mm.state.rect,
      g: document.querySelectorAll(".markmap-node").length,
      lk: document.querySelectorAll(".markmap-link").length,
      t: (document.querySelector("#mindmap > g") || {}).getAttribute ? document.querySelector("#mindmap > g").getAttribute("transform") : null
    });
    if (++n > 60) clearInterval(dbg);
  }, 300);
}
if (qs.get("instant") === "1") $("overlay").classList.add("no-anim");
if (qs.get("map") === "1") setTimeout(openMap, 80);
</script>
</body>
</html>
